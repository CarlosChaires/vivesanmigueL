<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera de Eventos y Feria | Vive San Miguel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- PapaParse para lectura rápida y limpia de CSV desde Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --cantera: #d97864;
      --cantera-hover: #c46551;
      --terracota: #a64b2a;
      --ocre: #d99b26;
      --noche: #1c1816;
      --fondo: #fbf9f6;
      --blanco: #ffffff;
      --gris-suave: #f0ebe4;
      --gris-texto: #6b635e;
      --borde: rgba(28, 24, 22, 0.08);
      --sombra-suave: 0 10px 30px -10px rgba(28, 24, 22, 0.06);
      --transicion: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--fondo);
      color: var(--noche);
      line-height: 1.6;
      padding: 3rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1.5rem;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .brand-logo {
      height: 65px;
      width: auto;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
      filter: drop-shadow(0 2px 4px rgba(28, 24, 22, 0.08));
    }

    .header-title span {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--terracota);
      font-weight: 600;
      display: block;
      margin-bottom: 0.3rem;
    }

    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 2.6rem);
      font-weight: 500;
      color: var(--noche);
    }

    .admin-actions-group {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-home {
      background: transparent;
      border: 1px solid var(--borde);
      color: var(--gris-texto);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transicion);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-home:hover {
      border-color: var(--cantera);
      color: var(--cantera);
      background: rgba(217, 120, 100, 0.03);
    }

    .month-section {
      margin-bottom: 4rem;
    }

    .month-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--terracota);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .month-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--borde);
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }

    .event-card {
      background: var(--blanco);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--borde);
      box-shadow: var(--sombra-suave);
      transition: var(--transicion);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .event-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -15px rgba(28, 24, 22, 0.1);
      border-color: rgba(217, 120, 100, 0.3);
    }

    .event-img-wrapper {
      width: 100%;
      height: 200px;
      position: relative;
      background: var(--gris-suave);
      overflow: hidden;
    }

    .event-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .event-card:hover .event-img-wrapper img {
      transform: scale(1.03);
    }

    .event-category {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(28, 24, 22, 0.75);
      backdrop-filter: blur(4px);
      color: var(--blanco);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
      z-index: 2;
    }

    .event-date-badge {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      color: var(--noche);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .event-body {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .event-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--noche);
    }

    .event-location {
      font-size: 0.85rem;
      color: var(--terracota);
      margin-bottom: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      text-decoration: none;
      transition: var(--transicion);
    }

    .event-location:hover {
      color: var(--cantera-hover);
      text-decoration: underline;
    }

    .event-desc {
      font-size: 0.95rem;
      color: var(--gris-texto);
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .event-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--borde);
      padding-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--gris-texto);
    }

    .event-time {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .event-price {
      font-weight: 600;
      color: var(--terracota);
    }

    .event-link-btn {
      display: inline-block;
      margin-top: 1rem;
      text-align: center;
      background: rgba(217, 120, 100, 0.08);
      color: var(--terracota);
      border: 1px solid rgba(217, 120, 100, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transicion);
    }

    .event-link-btn:hover {
      background: var(--cantera);
      color: var(--blanco);
      border-color: var(--cantera);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gris-texto);
      font-style: italic;
    }

    footer {
      margin-top: 5rem;
      border-top: 1px solid var(--borde);
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--gris-texto);
    }

    .sync-status {
      font-size: 0.75rem;
      color: var(--gris-texto);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      background-color: #27ae60;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-container">
        <img src="https://lh3.googleusercontent.com/d/1xeRKNH0R1dq7dfin7Jcmshb1j9SLEHOA=s800" alt="Vive San Miguel Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="header-title">
          <span>Patrimonio y Tradición</span>
          <h1>Cartelera Sincronizada</h1>
        </div>
      </div>
      <div class="admin-actions-group">
        <a href="https://carloschaires.github.io/vivesanmigueL/menu" class="btn-home">
          Volver al Inicio
        </a>
      </div>
    </header>

    <div id="eventsContainer">
      <div class="empty-state">Sincronizando cartelera desde Google Sheets...</div>
    </div>
  </div>

  <footer>
    <div style="display: flex; flex-direction: column; gap: 0.3rem;">
      <div>Vive San Miguel de Allende &copy; 2026</div>
      <div class="sync-status"><span class="sync-dot"></span> Nube Google Sheets Activa</div>
    </div>
  </footer>

  <script>
    // Tu enlace CSV oficial actualizado de Google Sheets
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWkQpk6tPdLeSm4sBtfS-rXWUGXzmD3-F3ZpsF383Yo97WiYLdzf6WMEAfkFfxnrRz_ZSprMMHmQss/pub?output=csv";

    const nombresMeses = {
      "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
      "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
      "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
    };

    function loadSheetEvents() {
      // Añadimos un parámetro aleatorio al final para evitar problemas de caché en GitHub Pages
      const nocacheUrl = SHEET_CSV_URL + "&t=" + new Date().getTime();
      
      Papa.parse(nocacheUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          renderEvents(results.data);
        },
        error: function(err) {
          console.error("Error al leer Google Sheets:", err);
          document.getElementById('eventsContainer').innerHTML = '<div class="empty-state">Error al conectar con la hoja de cálculo. Verifica tu conexión o el formato público.</div>';
        }
      });
    }

    function renderEvents(events) {
      const container = document.getElementById('eventsContainer');

      if (!events || events.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay eventos registrados en este momento.</div>';
        return;
      }

      // Ordenar por fecha ascendente
      events.sort((a, b) => new Date((a.date || '') + 'T00:00:00') - new Date((b.date || '') + 'T00:00:00'));

      const grouped = {};
      events.forEach(ev => {
        if (!ev.date) return;
        const parts = ev.date.split('-');
        if (parts.length < 2) return;
        const year = parts[0];
        const month = parts[1];
        const key = `${year}-${month}`;
        if (!grouped[key]) {
          grouped[key] = {
            year: year,
            monthName: nombresMeses[month] || month,
            items: []
          };
        }
        grouped[key].items.push(ev);
      });

      let html = '';
      for (const key in grouped) {
        const group = grouped[key];
        html += `
          <div class="month-section">
            <h2 class="month-title">${group.monthName} ${group.year}</h2>
            <div class="events-grid">
        `;

        group.items.forEach(ev => {
          const fallbackImg = "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80";
          const imgSrc = ev.img && ev.img.trim() !== "" ? ev.img : fallbackImg;
          
          let exactDateLabel = ev.date;
          try {
            const dateObj = new Date(ev.date + 'T00:00:00');
            const dayNum = dateObj.getDate();
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const dayNameStr = dayNames[dateObj.getDay()];
            exactDateLabel = `${dayNameStr} ${dayNum}`;
          } catch(err) {}

          const webLinkHtml = ev.web && ev.web.trim() !== "" 
            ? `<a href="${ev.web}" target="_blank" rel="noopener noreferrer" class="event-link-btn">Visitar Sitio Web →</a>` 
            : '';

          const locationText = ev.location && ev.location.trim() !== "" ? ev.location : "San Miguel de Allende";
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locationText + ", San Miguel de Allende")}`;

          html += `
            <div class="event-card">
              <div class="event-img-wrapper">
                <span class="event-category">${ev.category || 'General'}</span>
                <span class="event-date-badge">${exactDateLabel}</span>
                <img src="${imgSrc}" alt="${ev.name || 'Evento'}" loading="lazy" onerror="this.src='${fallbackImg}'">
              </div>
              <div class="event-body">
                <h3 class="event-name">${ev.name || 'Sin título'}</h3>
                <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="event-location" title="Ver en Google Maps">
                  <span>📍 ${locationText}</span>
                </a>
                <p class="event-desc">${ev.desc || ''}</p>
                ${webLinkHtml}
                <div class="event-meta">
                  <div class="event-time">🕒 ${ev.time || 'Por definir'}</div>
                  <div class="event-price">${ev.price || 'Entrada Libre'}</div>
                </div>
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSheetEvents();
    });
  </script>
</body>
</html>
