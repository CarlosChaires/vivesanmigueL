<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera de Eventos y Feria | Vive San Miguel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SheetJS para lectura de Excel (.xlsx) local -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --cantera: #d97864;
      --cantera-hover: #c46551;
      --terracota: #a64b2a;
      --ocre: #d99b26;
      --noche: #1c1816;
      --fondo: #fbf9f6;
      --blanco: #ffffff;
      --gris-suave: #f0ebe4;
      --gris-texto: #6b635e;
      --borde: rgba(28, 24, 22, 0.08);
      --sombra-suave: 0 10px 30px -10px rgba(28, 24, 22, 0.06);
      --transicion: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--fondo);
      color: var(--noche);
      line-height: 1.6;
      padding: 3rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container { max-width: 1200px; margin: 0 auto; width: 100%; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1.5rem;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-container { display: flex; align-items: center; gap: 1.2rem; }
    .brand-logo { height: 65px; width: auto; object-fit: contain; }

    .header-title span {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em;
      color: var(--terracota); font-weight: 600; display: block; margin-bottom: 0.3rem;
    }

    .header-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 2.6rem); font-weight: 500; color: var(--noche);
    }

    .admin-actions-group { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }

    .admin-trigger, .btn-home {
      background: transparent; border: 1px solid var(--borde); color: var(--gris-texto);
      padding: 0.6rem 1.2rem; border-radius: 30px; font-size: 0.85rem; cursor: pointer;
      transition: var(--transicion); display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
    }

    .admin-trigger.visible { display: inline-flex; }
    .admin-trigger { display: none; }
    .admin-trigger:hover, .btn-home:hover { border-color: var(--cantera); color: var(--cantera); background: rgba(217, 120, 100, 0.03); }

    .admin-trigger.btn-excel { background: rgba(46, 125, 50, 0.05); border-color: rgba(46, 125, 50, 0.2); color: #2e7d32; }
    .admin-trigger.btn-excel:hover { background: #2e7d32; color: var(--blanco); }

    .month-section { margin-bottom: 4rem; }
    .month-title {
      font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 600;
      color: var(--terracota); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;
    }
    .month-title::after { content: ""; flex: 1; height: 1px; background: var(--borde); }

    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2rem; }

    .event-card {
      background: var(--blanco); border-radius: 16px; overflow: hidden;
      border: 1px solid var(--borde); box-shadow: var(--sombra-suave);
      transition: var(--transicion); display: flex; flex-direction: column; position: relative;
    }
    .event-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(28, 24, 22, 0.1); }

    .event-img-wrapper { width: 100%; height: 200px; position: relative; background: var(--gris-suave); overflow: hidden; }
    .event-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
    .event-card:hover .event-img-wrapper img { transform: scale(1.03); }

    .event-category {
      position: absolute; top: 1rem; left: 1rem; background: rgba(28, 24, 22, 0.75);
      backdrop-filter: blur(4px); color: var(--blanco); padding: 0.3rem 0.8rem;
      border-radius: 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 500; z-index: 2;
    }

    .event-date-badge {
      position: absolute; bottom: 1rem; left: 1rem; background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px); color: var(--noche); padding: 0.25rem 0.6rem;
      border-radius: 6px; font-size: 0.75rem; font-weight: 600; z-index: 2;
    }

    .event-body { padding: 1.8rem; display: flex; flex-direction: column; flex: 1; }
    .event-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
    .event-location { font-size: 0.85rem; color: var(--terracota); margin-bottom: 0.8rem; font-weight: 500; text-decoration: none; }
    .event-desc { font-size: 0.95rem; color: var(--gris-texto); margin-bottom: 1.5rem; flex: 1; }
    .event-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--borde); padding-top: 1.2rem; font-size: 0.85rem; color: var(--gris-texto); }
    .event-price { font-weight: 600; color: var(--terracota); }

    .card-actions { position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; opacity: 0; transition: var(--transicion); z-index: 2; }
    .admin-logged .event-card:hover .card-actions { opacity: 1; }
    .action-btn { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--borde); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .action-btn:hover { background: var(--cantera); color: var(--blanco); }

    footer { margin-top: 5rem; border-top: 1px solid var(--borde); padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--gris-texto); }
    .footer-lock { background: none; border: none; color: var(--gris-texto); cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; }
    .footer-lock:hover { color: var(--cantera); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(28, 24, 22, 0.5); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 1000; opacity: 0; pointer-events: none; transition: var(--transicion); }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--blanco); width: 100%; max-width: 500px; border-radius: 20px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .form-group { margin-bottom: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    input, textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--borde); border-radius: 8px; font-family: inherit; background: var(--fondo); }
    .btn-primary { background: var(--cantera); color: var(--blanco); border: none; width: 100%; padding: 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--gris-texto); font-style: italic; }
  </style>
</head>
<body id="pageBody">

  <div class="container">
    <header>
      <div class="brand-container">
        <img src="https://lh3.googleusercontent.com/d/1xeRKNH0R1dq7dfin7Jcmshb1j9SLEHOA=s800" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="header-title">
          <span>Patrimonio y Tradición</span>
          <h1>Cartelera de Eventos y Feria</h1>
        </div>
      </div>
      <div class="admin-actions-group">
        <a href="https://carloschaires.github.io/vivesanmigueL/menu" class="btn-home">Volver al Inicio</a>
        <button class="admin-trigger btn-excel" id="excelBtn" onclick="openExcelModal()">Subir Excel</button>
        <button class="admin-trigger" id="manageBtn" onclick="openAdminModal()">+ Nuevo Evento</button>
      </div>
    </header>

    <div id="eventsContainer"><div class="empty-state">Cargando cartelera cultural...</div></div>
  </div>

  <footer>
    <div>Vive San Miguel de Allende &copy; 2026</div>
    <button class="footer-lock" onclick="openLoginModal()"><span id="lockLabel">Acceso Admin</span></button>
  </footer>

  <!-- Modales -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box" style="max-width: 400px;">
      <h3>Acceso Restringido</h3>
      <form onsubmit="handleLogin(event)" style="margin-top: 1rem;">
        <div class="form-group"><label>Usuario</label><input type="text" id="usernameInput" required></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="passwordInput" required></div>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="excelModal">
    <div class="modal-box">
      <h3>Carga Masiva (Excel)</h3>
      <form onsubmit="handleExcelUpload(event)" style="margin-top: 1rem;">
        <div class="form-group"><label>Archivo .xlsx</label><input type="file" id="excelFileInput" accept=".xlsx" required></div>
        <button type="submit" class="btn-primary">Importar</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3 id="modalTitle">Nuevo Evento</h3>
      <form onsubmit="handleFormSubmit(event)" style="margin-top: 1rem;">
        <input type="hidden" id="eventId">
        <div class="form-group"><label>Nombre</label><input type="text" id="eventNameInput" required></div>
        <div class="form-row">
          <div class="form-group"><label>Categoría</label><input type="text" id="eventCategoryInput" required></div>
          <div class="form-group"><label>Fecha</label><input type="date" id="eventDateInput" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Horario</label><input type="text" id="eventTimeInput" required></div>
          <div class="form-group"><label>Costo</label><input type="text" id="eventPriceInput" required></div>
        </div>
        <div class="form-group"><label>Lugar</label><input type="text" id="eventLocationInput" required></div>
        <div class="form-group"><label>Imagen (URL)</label><input type="url" id="eventImgInput" placeholder="https://..."></div>
        <div class="form-group"><label>Descripción</label><textarea id="eventDescInput" required></textarea></div>
        <button type="submit" class="btn-primary">Guardar</button>
      </form>
    </div>
  </div>

  <script>
    const AUTH_USER = "vivesanmiguel";
    const AUTH_PASS = "c4rl0s1107";
    const STORAGE_KEY = "vivesanmiguel_events_local_v10";

    const defaultEvents = [
      { id: "ev-1", name: "Inauguración de la Feria", category: "Feria SMA", date: "2026-09-25", time: "18:00 hrs", price: "Acceso General", location: "Recinto Ferial", img: "https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=800&q=80", desc: "Gran apertura con juegos mecánicos y pirotecnia." },
      { id: "ev-2", name: "Cena de Gala Santa Catrina", category: "Gastronomía", date: "2026-10-30", time: "20:00 hrs", price: "$2,500 MXN", location: "Viñedos San Lucas", img: "https://images.unsplash.com/photo-1555244162-803834f70033?auto=format&fit=crop&w=800&q=80", desc: "Experiencia gourmet de 4 tiempos." }
    ];

    let globalEvents = [];

    function loadEvents() {
      const stored = localStorage.getItem(STORAGE_KEY);
      globalEvents = stored ? JSON.parse(stored) : defaultEvents;
      renderEvents();
    }

    function saveEvents(events) {
      globalEvents = events;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(globalEvents));
      renderEvents();
    }

    function checkSession() {
      const isLogged = localStorage.getItem('sma_admin_logged') === 'true';
      document.getElementById('manageBtn').classList.toggle('visible', isLogged);
      document.getElementById('excelBtn').classList.toggle('visible', isLogged);
      document.body.classList.toggle('admin-logged', isLogged);
      document.getElementById('lockLabel').innerText = isLogged ? "Cerrar Sesión" : "Acceso Admin";
    }

    function renderEvents() {
      const container = document.getElementById('eventsContainer');
      if (!globalEvents.length) { container.innerHTML = '<div class="empty-state">No hay eventos registrados.</div>'; return; }
      
      globalEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
      let html = '';
      
      globalEvents.forEach(ev => {
        html += `
          <div class="event-card">
            <div class="event-img-wrapper">
              <span class="event-category">${ev.category}</span>
              <span class="event-date-badge">${ev.date}</span>
              <img src="${ev.img}" alt="${ev.name}">
              <div class="card-actions">
                <button class="action-btn" onclick="deleteEvent('${ev.id}')">🗑️</button>
              </div>
            </div>
            <div class="event-body">
              <h3 class="event-name">${ev.name}</h3>
              <span class="event-location">📍 ${ev.location}</span>
              <p class="event-desc">${ev.desc}</p>
              <div class="event-meta">
                <span>🕒 ${ev.time}</span>
                <span class="event-price">${ev.price}</span>
              </div>
            </div>
          </div>`;
      });
      container.innerHTML = `<div class="events-grid">${html}</div>`;
    }

    function openLoginModal() {
      if (localStorage.getItem('sma_admin_logged') === 'true') {
        localStorage.removeItem('sma_admin_logged');
        checkSession();
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    }
    function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }
    function handleLogin(e) {
      e.preventDefault();
      if(document.getElementById('usernameInput').value === AUTH_USER && document.getElementById('passwordInput').value === AUTH_PASS) {
        localStorage.setItem('sma_admin_logged', 'true');
        closeLoginModal(); checkSession();
      } else { alert('Credenciales incorrectas'); }
    }

    function openAdminModal() { document.getElementById('adminModal').classList.add('active'); }
    function openExcelModal() { document.getElementById('excelModal').classList.add('active'); }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newEv = {
        id: 'ev-' + Date.now(),
        name: document.getElementById('eventNameInput').value,
        category: document.getElementById('eventCategoryInput').value,
        date: document.getElementById('eventDateInput').value,
        time: document.getElementById('eventTimeInput').value,
        price: document.getElementById('eventPriceInput').value,
        location: document.getElementById('eventLocationInput').value,
        img: document.getElementById('eventImgInput').value || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80',
        desc: document.getElementById('eventDescInput').value
      };
      saveEvents([...globalEvents, newEv]);
      document.getElementById('adminModal').classList.remove('active');
    }

    function deleteEvent(id) {
      if(confirm('¿Eliminar evento?')) {
        saveEvents(globalEvents.filter(ev => ev.id !== id));
      }
    }

    document.addEventListener('DOMContentLoaded', () => { checkSession(); loadEvents(); });
  </script>
</body>
</html>
