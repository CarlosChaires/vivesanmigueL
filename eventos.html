<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Eventos - Vive San Miguel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.96);
            --cantera-terracotta: #b86b43;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-glass: rgba(184, 107, 67, 0.18);
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            min-height: 100vh;
        }
        .wrapper { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--primary-navy); margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card {
            background: var(--surface-glass);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(27, 42, 74, 0.05);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 { color: var(--primary-navy); margin-top: 0; font-family: 'Playfair Display', serif; font-size: 1.3rem; }
        .card p { color: var(--text-muted); font-size: 0.95rem; }
        .meta { font-size: 0.85rem; color: var(--cantera-terracotta); font-weight: 600; margin-top: 15px; line-height: 1.5; background: rgba(184, 107, 67, 0.05); padding: 10px; border-radius: 10px; }
        .btn-volver {
            display: inline-block; margin-bottom: 30px;
            padding: 10px 24px; background: #fff; color: var(--primary-navy);
            border: 1px solid var(--border-glass); border-radius: 30px;
            text-decoration: none; font-weight: 600; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="https://carloschaires.github.io/vivesanmigueL/" class="btn-volver">← Volver al Inicio</a>
        
        <div class="header">
            <h1>Agenda Cultural y de Eventos</h1>
            <p>Sincronizada con las mejores actividades de San Miguel de Allende.</p>
        </div>

        <div id="contenedor-eventos" class="grid">
            <p style="text-align: center; grid-column: 1/-1;">Cargando cartelera...</p>
        </div>
    </div>

    <script>
        const respaldo = [
            { titulo: "Festival Cervantino SMA", descripcion: "Expresiones artísticas y teatro en escenarios históricos.", fecha: "Próximamente", lugar: "Centro Histórico", costo: "Entrada libre" },
            { titulo: "Cata en Viñedos Locales", descripcion: "Experiencia enológica exclusiva con catas y maridajes.", fecha: "Fines de semana", lugar: "Viñedos de la región", costo: "Desde $800 MXN" }
        ];

        async function cargar() {
            try {
                let res = await fetch('eventos_sma.json?' + new Date().getTime());
                if (!res.ok) throw new Error();
                let data = await res.json();
                pintar(data.length ? data : respaldo);
            } catch {
                pintar(respaldo);
            }
        }

        function pintar(lista) {
            let cont = document.getElementById('contenedor-eventos');
            cont.innerHTML = '';
            lista.forEach(ev => {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div>
                        <h3>${ev.titulo}</h3>
                        <p>${ev.descripcion}</p>
                    </div>
                    <div class="meta">
                        📅 ${ev.fecha} <br>
                        📍 ${ev.lugar} <br>
                        💰 ${ev.costo}
                    </div>
                `;
                cont.appendChild(div);
            });
        }
        cargar();
    </script>
</body>
</html>
