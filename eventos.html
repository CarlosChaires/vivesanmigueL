<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera de Eventos | Vive San Miguel</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c45c4a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">

  <style>
    :root {
      --cantera: #c45c4a;
      --cantera-hover: #a84a3a;
      --cantera-soft: rgba(196, 92, 74, 0.10);
      --cantera-glow: rgba(196, 92, 74, 0.28);
      --terracota: #8f3d28;
      --noche: #1a1614;
      --fondo: #f7f3ee;
      --blanco: #ffffff;
      --gris-suave: #f0ebe5;
      --gris-texto: #5c554f;
      --gris-muted: #8a827a;
      --borde: rgba(26, 22, 20, 0.07);
      --borde-fuerte: rgba(26, 22, 20, 0.11);
      --sombra-card: 0 6px 28px -8px rgba(26, 22, 20, 0.10), 0 2px 8px rgba(26, 22, 20, 0.04);
      --sombra-hover: 0 24px 48px -14px rgba(26, 22, 20, 0.16), 0 10px 20px -8px rgba(26, 22, 20, 0.08);
      --sombra-sticky: 0 8px 32px -8px rgba(26, 22, 20, 0.10);
      --transicion: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--fondo);
      color: var(--noche);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 0 1.5rem;
    }

    /* ── Header ── */
    .site-header {
      padding: 2.4rem 0 1.9rem;
      border-bottom: 1px solid var(--borde);
      background: linear-gradient(180deg, #faf7f3 0%, var(--fondo) 100%);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .brand-logo {
      height: 58px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.08));
    }

    .header-title span {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      color: var(--terracota);
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }

    .header-title h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.85rem, 3.2vw, 2.4rem);
      font-weight: 500;
      color: var(--noche);
      letter-spacing: -0.025em;
      line-height: 1.12;
    }

    .admin-actions-group {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-trigger, .btn-home, .lang-custom-btn {
      background: transparent;
      border: 1px solid var(--borde-fuerte);
      color: var(--gris-texto);
      padding: 0.58rem 1.25rem;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transicion);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      font-weight: 500;
      font-family: inherit;
    }

    .admin-trigger { display: none; }

    body.admin-logged .admin-panel-btn {
      display: inline-flex;
      background: var(--cantera);
      color: var(--blanco);
      border-color: var(--cantera);
      box-shadow: 0 5px 18px -3px var(--cantera-glow);
    }

    .admin-trigger:hover, .btn-home:hover, .lang-custom-btn:hover {
      border-color: var(--cantera);
      color: var(--cantera);
      background: var(--cantera-soft);
      transform: translateY(-1px);
    }

    /* ── Sticky Toolbar ── */
    .toolbar-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 243, 238, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--borde);
      padding: 1.15rem 0;
      margin-bottom: 2.5rem;
    }

    .toolbar {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .toolbar.visible { display: flex; }

    .search-row {
      display: flex;
      gap: 1.1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.88rem 1.2rem 0.88rem 3rem;
      border: 1px solid var(--borde-fuerte);
      border-radius: 999px;
      background: var(--blanco);
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--noche);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: var(--transicion);
    }

    .search-box input:focus {
      border-color: var(--cantera);
      box-shadow: 0 0 0 4px var(--cantera-soft), 0 4px 14px rgba(196, 92, 74, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 1.15rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gris-muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .results-count {
      font-size: 0.82rem;
      color: var(--gris-muted);
      white-space: nowrap;
      font-weight: 600;
      min-width: 5.8rem;
      text-align: right;
      letter-spacing: 0.01em;
    }

    /* ── Grid ── */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
      padding-bottom: 1.5rem;
    }

    .event-card {
      background: var(--blanco);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--borde);
      box-shadow: var(--sombra-card);
      transition: var(--transicion);
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }

    .event-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--sombra-hover);
      border-color: rgba(196, 92, 74, 0.18);
    }

    /* ── Imagen mejorada ── */
    .event-img-wrapper {
      width: 100%;
      height: 248px;
      position: relative;
      background: linear-gradient(145deg, #e8e2da, #f2ece6);
      overflow: hidden;
      flex-shrink: 0;
    }

    .event-img-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(26, 22, 20, 0.55) 0%,
        rgba(26, 22, 20, 0.18) 38%,
        transparent 68%
      );
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .event-card:hover .event-img-wrapper::after {
      opacity: 0.85;
    }

    .event-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .event-card:hover .event-img-wrapper img {
      transform: scale(1.08);
    }

    .event-category {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.32rem 0.9rem;
      border-radius: 999px;
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 650;
      letter-spacing: 0.06em;
      z-index: 3;
      color: #fff;
      background: rgba(143, 61, 40, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 3px 12px rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .event-date-badge {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--noche);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      z-index: 3;
      box-shadow: 0 3px 14px rgba(0,0,0,0.14);
      letter-spacing: 0.02em;
    }

    .admin-card-actions {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: none;
      gap: 0.35rem;
      z-index: 10;
    }

    body.admin-logged .admin-card-actions { display: flex; }

    .btn-card-edit, .btn-card-delete {
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transicion);
      box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      font-size: 0.85rem;
    }

    .btn-card-edit {
      background: rgba(196, 138, 31, 0.96);
      color: #fff;
    }
    .btn-card-delete {
      background: rgba(179, 57, 57, 0.94);
      color: #fff;
    }

    .btn-card-edit:hover, .btn-card-delete:hover {
      transform: scale(1.08);
    }

    .event-body {
      padding: 1.45rem 1.5rem 1.6rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .event-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.32rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.32;
      color: var(--noche);
      letter-spacing: -0.015em;
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.2rem;
      margin-bottom: 0.9rem;
      font-size: 0.84rem;
      color: var(--gris-texto);
    }

    .event-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .event-meta .meta-sep {
      color: var(--gris-muted);
      opacity: 0.5;
      margin: 0 0.15rem;
    }
    .event-meta .price {
      color: var(--terracota);
      font-weight: 650;
    }

    .event-location {
      font-size: 0.88rem;
      color: var(--terracota);
      margin-bottom: 0.9rem;
      font-weight: 550;
      text-decoration: none;
      display: inline-flex;
      align-items: flex-start;
      gap: 0.4rem;
      transition: color 0.25s ease;
    }

    .event-location:hover {
      color: var(--cantera);
    }

    .event-desc {
      font-size: 0.91rem;
      color: var(--gris-texto);
      margin: 0 0 1.25rem;
      flex: 1;
      line-height: 1.72;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .event-web-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--cantera);
      color: var(--blanco);
      padding: 0.55rem 1.05rem;
      border-radius: var(--radius-xs);
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 650;
      margin-top: auto;
      width: fit-content;
      box-shadow: 0 4px 14px -3px var(--cantera-glow);
      transition: var(--transicion);
      letter-spacing: 0.01em;
    }

    .event-web-link:hover {
      background: var(--cantera-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px var(--cantera-glow);
    }

    /* ── Skeleton & Empty States ── */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }
    .skeleton-card {
      background: var(--blanco);
      border-radius: var(--radius);
      height: 420px;
      border: 1px solid var(--borde);
      position: relative;
      overflow: hidden;
    }
    .skeleton-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .empty-state {
      text-align: center;
      padding: 5.5rem 2rem;
      color: var(--gris-texto);
    }
    .empty-state p {
      font-size: 1.05rem;
      max-width: 380px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Footer & Modals ── */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--borde);
      padding: 1.85rem 0;
      background: var(--fondo);
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--gris-muted);
    }
    .footer-lock {
      background: none;
      border: 1px solid transparent;
      color: var(--gris-muted);
      cursor: pointer;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-family: inherit;
      transition: var(--transicion);
    }
    .footer-lock:hover {
      color: var(--cantera);
      background: var(--cantera-soft);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 22, 20, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--blanco);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      padding: 2.4rem;
      box-shadow: 0 36px 72px -18px rgba(0,0,0,0.32);
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 1.05rem; }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 650;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      color: var(--gris-muted);
      letter-spacing: 0.04em;
    }
    input, textarea {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border: 1px solid var(--borde-fuerte);
      border-radius: var(--radius-sm);
      font-family: inherit;
      background: var(--fondo);
      color: var(--noche);
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    input:focus, textarea:focus {
      border-color: var(--cantera);
      box-shadow: 0 0 0 3px var(--cantera-soft);
    }
    .img-upload-box {
      background: var(--fondo);
      border: 1px dashed var(--borde-fuerte);
      border-radius: var(--radius-sm);
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .img-upload-divider {
      text-align: center;
      font-size: 0.7rem;
      color: var(--gris-muted);
      font-weight: 600;
    }
    .btn-primary {
      background: var(--cantera);
      color: var(--blanco);
      border: none;
      width: 100%;
      padding: 0.95rem;
      border-radius: var(--radius-sm);
      font-weight: 650;
      cursor: pointer;
      margin-top: 1rem;
      transition: var(--transicion);
      font-size: 0.95rem;
    }
    .btn-primary:hover {
      background: var(--cantera-hover);
      box-shadow: 0 6px 18px -4px var(--cantera-glow);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .modal-header h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 600;
    }
    .modal-close-x {
      background: var(--gris-suave);
      border: 1px solid var(--borde-fuerte);
      color: var(--noche);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.15rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transicion);
      font-family: inherit;
    }
    .modal-close-x:hover {
      background: var(--cantera);
      color: var(--blanco);
      border-color: var(--cantera);
    }

    /* Responsive refinements */
    @media (max-width: 640px) {
      .event-img-wrapper { height: 220px; }
      .events-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .header-title h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body id="pageBody">

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-container">
        <img src="https://lh3.googleusercontent.com/d/1xeRKNH0R1dq7dfin7Jcmshb1j9SLEHOA=s800" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="header-title">
          <span id="subHeaderTitle">Patrimonio y Tradición</span>
          <h1 id="mainHeaderTitle">Cartelera de Eventos</h1>
        </div>
      </div>
      <div class="admin-actions-group">
        <button class="lang-custom-btn" id="langCustomBtn" onclick="toggleLanguage()">🇬🇧 English</button>
        <button class="admin-trigger admin-panel-btn" onclick="openEventModal()">+ Agregar Evento</button>
        <a href="https://carloschaires.github.io/vivesanmigueL/menu" class="btn-home" id="btnHomeText">Volver al Inicio</a>
      </div>
    </div>
  </header>

  <!-- Sticky Toolbar -->
  <div class="toolbar-wrapper" id="toolbarWrapper">
    <div class="container">
      <div class="toolbar" id="toolbar">
        <div class="search-row">
          <div class="search-box">
            <input type="search" id="searchInput" placeholder="Buscar por tipo, mes, nombre o lugar… (ej. cine, octubre, jazz)" autocomplete="off">
            <span class="search-icon">🔍</span>
          </div>
          <span class="results-count" id="resultsCount">0 eventos</span>
        </div>
      </div>
    </div>
  </div>

  <main class="container" style="flex: 1; padding-bottom: 3.5rem;">
    <div id="eventsContainer">
      <div class="skeleton-grid" id="skeletonLoader">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-inner">
      <div class="footer-brand">Vive San Miguel de Allende &copy; 2026</div>
      <button class="footer-lock" onclick="openLoginModal()"><span id="lockLabel">Acceso Admin</span></button>
    </div>
  </footer>

  <!-- Modal Login -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="loginModalTitle">Acceso Restringido</h3>
        <button type="button" class="modal-close-x" onclick="closeLoginModal()" aria-label="Cerrar">&times;</button>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group"><label>Usuario</label><input type="text" id="usernameInput" required></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="passwordInput" required></div>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- Modal Agregar / Editar Evento -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="eventModalTitle">Nuevo Evento</h3>
        <button type="button" class="modal-close-x" onclick="closeEventModal()" aria-label="Cerrar">&times;</button>
      </div>
      <form onsubmit="handleSaveEvent(event)" id="eventForm">
        <input type="hidden" id="editRowIndex" value="">
        <div class="form-group"><label>Nombre del Evento (Español)</label><input type="text" id="inputName" required></div>
        <div class="form-group"><label>Nombre del Evento (Inglés / Name EN)</label><input type="text" id="inputNameEn"></div>
        <div class="form-group"><label>Categoría (Español)</label><input type="text" id="inputCategory" placeholder="Cultura y Tradición" required></div>
        <div class="form-group"><label>Categoría (Inglés / Category EN)</label><input type="text" id="inputCategoryEn"></div>
        <div class="form-group"><label>Fecha</label><input type="date" id="inputDate" required></div>
        <div class="form-group"><label>Horario</label><input type="time" id="inputTime" required></div>
        <div class="form-group"><label>Costo / Precio (Español)</label><input type="text" id="inputPrice" placeholder="Entrada Libre" required></div>
        <div class="form-group"><label>Costo / Precio (Inglés / Price EN)</label><input type="text" id="inputPriceEn" placeholder="Free Event"></div>
        <div class="form-group"><label>Ubicación</label><input type="text" id="inputLocation" placeholder="Explanada del Jardín" required></div>
        <div class="form-group"><label>Sitio Oficial o Boletos (Opcional)</label><input type="text" id="inputWeb"></div>

        <div class="form-group">
          <label>Imagen del Evento (Subir a Drive o Pegar Link)</label>
          <div class="img-upload-box">
            <input type="file" id="inputImgFile" accept="image/*" style="background: var(--blanco); padding: 0.45rem;">
            <div class="img-upload-divider">— O PEGA UN ENLACE DIRECTO —</div>
            <input type="text" id="inputImg" placeholder="https://...">
          </div>
        </div>

        <div class="form-group"><label>Descripción (Español)</label><textarea id="inputDesc" required rows="3"></textarea></div>
        <div class="form-group"><label>Descripción (Inglés / Desc EN)</label><textarea id="inputDescEn" rows="3"></textarea></div>
        <button type="submit" id="submitEventBtn" class="btn-primary">Guardar en Sistema</button>
      </form>
    </div>
  </div>

  <script>
    const AUTH_USER = "vivesanmiguel";
    const AUTH_PASS = "c4rl0s1107";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx6-BX3TRw7LsLnHnSCQDdidTVLBaWUHFP32EYNu9WFtBKy9cF1913Tld6abPoEPohi/exec";

    let globalEvents = [];
    let isEditMode = false;
    let searchQuery = '';
    let currentLang = 'es';

    function toggleLanguage() {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      const btn = document.getElementById('langCustomBtn');
      
      if (currentLang === 'en') {
        btn.innerHTML = '🇲🇽 Español';
        document.getElementById('subHeaderTitle').textContent = 'Heritage & Tradition';
        document.getElementById('mainHeaderTitle').textContent = 'Events Calendar';
        document.getElementById('searchInput').placeholder = 'Search by type, month, name or venue...';
        document.getElementById('lockLabel').textContent = 'Admin Access';
        document.getElementById('btnHomeText').textContent = 'Back to Home';
      } else {
        btn.innerHTML = '🇬🇧 English';
        document.getElementById('subHeaderTitle').textContent = 'Patrimonio y Tradición';
        document.getElementById('mainHeaderTitle').textContent = 'Cartelera de Eventos';
        document.getElementById('searchInput').placeholder = 'Buscar por tipo, mes, nombre o lugar…';
        document.getElementById('lockLabel').textContent = 'Acceso Admin';
        document.getElementById('btnHomeText').textContent = 'Volver al Inicio';
      }
      applyFilters();
    }

    function sanitizeUrl(url) {
      if (!url) return '';
      let clean = String(url).trim();
      if (clean === '' || clean.toLowerCase() === 'nan' || clean.length < 4) return '';
      if (!/^https?:\/\//i.test(clean)) clean = 'https://' + clean;
      try { new URL(clean); return clean; } catch (e) { return ''; }
    }

    function parseCloudImageUrl(url) {
      if (!url) return '';
      let cleanUrl = String(url).trim();
      if (cleanUrl.includes('drive.google.com')) {
        let fileId = '';
        if (cleanUrl.includes('/file/d/')) fileId = cleanUrl.split('/file/d/')[1].split('/')[0];
        else if (cleanUrl.includes('id=')) fileId = new URLSearchParams(cleanUrl.split('?')[1]).get('id');
        if (fileId) return 'https://lh3.googleusercontent.com/d/' + fileId + '=s800';
      }
      return cleanUrl;
    }

    function formatCleanTime(rawTime) {
      if (!rawTime) return currentLang === 'en' ? 'All day' : 'Todo el día';
      let str = String(rawTime).trim();
      if (str.includes('1899-12-30') || (str.includes('T') && str.endsWith('Z'))) {
        let d = new Date(str);
        if (!isNaN(d.getTime())) {
          let hh = String(d.getHours()).padStart(2, '0');
          let mm = String(d.getMinutes()).padStart(2, '0');
          return hh + ':' + mm;
        }
      }
      let match = str.match(/(\d{1,2}):(\d{2})/);
      if (match) {
        return match[1].padStart(2, '0') + ':' + match[2];
      }
      return str;
    }

    function formatDateToSpanish(dateString) {
      if (!dateString) return currentLang === 'en' ? 'Date to be confirmed' : 'Fecha por confirmar';
      const cleanStr = String(dateString).trim();
      if (!cleanStr || cleanStr.includes('1899')) return currentLang === 'en' ? 'Date to be confirmed' : 'Fecha por confirmar';
      try {
        let date;
        if (/^\d{4}-\d{2}-\d{2}$/.test(cleanStr)) {
          const p = cleanStr.split('-');
          date = new Date(+p[0], +p[1] - 1, +p[2]);
        } else {
          date = new Date(cleanStr);
        }
        if (isNaN(date.getTime())) return cleanStr;
        const locale = currentLang === 'en' ? 'en-US' : 'es-ES';
        const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' };
        let f = date.toLocaleDateString(locale, opts);
        return f.charAt(0).toUpperCase() + f.slice(1);
      } catch (e) { return cleanStr; }
    }

    function formatDateShort(dateString) {
      if (!dateString) return '';
      var cleanStr = String(dateString).trim();
      try {
        var date;
        if (/^\d{4}-\d{2}-\d{2}$/.test(cleanStr)) {
          var p = cleanStr.split('-');
          date = new Date(+p[0], +p[1] - 1, +p[2]);
        } else {
          date = new Date(cleanStr);
        }
        if (isNaN(date.getTime())) return '';
        var dias = currentLang === 'en' ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] : ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        var meses = currentLang === 'en' ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] : ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        return dias[date.getUTCDay()] + ' ' + date.getUTCDate() + ' ' + meses[date.getUTCMonth()];
      } catch (e) { return ''; }
    }

    async function fetchGoogleSheetData() {
      try {
        const response = await fetch(WEB_APP_URL);
        if (!response.ok) throw new Error('Error de conexión');
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error('Sin datos');

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const mappedEvents = data.map(function(item, index) {
          const findKey = function(possibleKeys) {
            const found = Object.keys(item).find(function(k) {
              const cleanK = k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
              return possibleKeys.some(function(pk) { return cleanK === pk || cleanK.includes(pk); });
            });
            return found ? String(item[found] || '').trim() : '';
          };

          const rawDateValue = findKey(['date (formato yyyy-mm-dd)', 'date', 'fecha']);
          const rawImgValue = findKey(['img', 'imagen']);
          const locationName = findKey(['location', 'lugar']) || 'San Miguel de Allende';
          const rawWebLink = findKey(['web', 'link', 'enlace', 'url']);

          const rawNameEs = findKey(['name', 'nombre']);
          const rawNameEn = findKey(['name_en', 'nameen']);
          const nameEs = rawNameEs;
          const nameEn = rawNameEn || rawNameEs;

          const catEs = findKey(['category', 'categoria']) || 'General';
          const catEn = findKey(['category_en', 'categoryen']) || catEs;

          const priceEs = findKey(['price', 'costo']) || 'Entrada Libre';
          const priceEn = findKey(['price_en', 'priceen']) || priceEs;

          const descEs = findKey(['desc', 'descripcion']) || 'Sin descripción detallada.';
          const descEn = findKey(['desc_en', 'descen']) || descEs;

          let eventDateObj = null;
          let normalizedDateStr = '';
          if (rawDateValue) {
            const cleanStr = String(rawDateValue).trim();
            const isoMatch = cleanStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (isoMatch) {
              normalizedDateStr = isoMatch[1] + '-' + isoMatch[2] + '-' + isoMatch[3];
              eventDateObj = new Date(+isoMatch[1], +isoMatch[2] - 1, +isoMatch[3]);
            } else {
              const parsed = new Date(cleanStr);
              if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2000) {
                eventDateObj = new Date(parsed.getUTCFullYear(), parsed.getUTCMonth(), parsed.getUTCDate());
                normalizedDateStr = parsed.getUTCFullYear() + '-' +
                  String(parsed.getUTCMonth() + 1).padStart(2, '0') + '-' +
                  String(parsed.getUTCDate()).padStart(2, '0');
              }
            }
          }

          const rawTimeValue = findKey(['time', 'hora']);
          const cleanHHMM = formatCleanTime(rawTimeValue);

          return {
            rowIndex: index + 2,
            name_es: nameEs,
            name_en: nameEn,
            category_es: catEs,
            category_en: catEn,
            price_es: priceEs,
            price_en: priceEn,
            desc_es: descEs,
            desc_en: descEn,
            rawDate: normalizedDateStr || rawDateValue,
            dateObj: eventDateObj,
            date: formatDateToSpanish(normalizedDateStr || rawDateValue),
            shortDate: formatDateShort(normalizedDateStr || rawDateValue),
            rawTimeHHMM: /^\d{2}:\d{2}$/.test(cleanHHMM) ? cleanHHMM : '',
            time: /^\d{2}:\d{2}$/.test(cleanHHMM) ? cleanHHMM + ' hrs' : cleanHHMM,
            location: locationName,
            mapsUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(locationName + ', San Miguel de Allende, Gto.'),
            link: sanitizeUrl(rawWebLink),
            img: parseCloudImageUrl(rawImgValue) || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80',
            rawImg: rawImgValue
          };
        });

        var filteredEvents = mappedEvents
          .filter(function(ev) {
            if (!ev.name_es || ev.name_es.toLowerCase() === 'nan' || ev.name_es.toLowerCase() === 'evento') return false;
            if (!ev.dateObj || isNaN(ev.dateObj.getTime())) return false;
            return ev.dateObj >= today;
          })
          .sort(function(a, b) {
            var diff = a.dateObj.getTime() - b.dateObj.getTime();
            if (diff !== 0) return diff;
            return (a.rawTimeHHMM || '99:99').localeCompare(b.rawTimeHHMM || '99:99');
          });

        var seenEvents = {};
        globalEvents = filteredEvents.filter(function(ev) {
          var normName = ev.name_es.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
          var normDate = (ev.rawDate || '').toString().split('T')[0].trim();
          var normTime = (ev.rawTimeHHMM || '').trim();
          var key = normName + '|' + normDate + '|' + normTime;
          if (seenEvents[key]) return false;
          seenEvents[key] = true;
          return true;
        });

        document.getElementById('toolbar').classList.add('visible');
        applyFilters();
      } catch (error) {
        console.error(error);
        document.getElementById('eventsContainer').innerHTML = 
          '<div class="empty-state"><p>No se pudieron cargar los eventos. Verifica tu conexión o el Web App de Google Sheets.</p></div>';
      }
    }

    function getFilteredEvents() {
      if (!searchQuery) return globalEvents;
      var q = searchQuery.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
      return globalEvents.filter(function(ev) {
        var name = (currentLang === 'en' ? ev.name_en : ev.name_es).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        var loc = (ev.location || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        var desc = (currentLang === 'en' ? ev.desc_en : ev.desc_es).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        var cat = (currentLang === 'en' ? ev.category_en : ev.category_es).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        return name.includes(q) || loc.includes(q) || desc.includes(q) || cat.includes(q);
      });
    }

    function applyFilters() {
      var filtered = getFilteredEvents();
      var countEl = document.getElementById('resultsCount');
      countEl.textContent = filtered.length === 0 ? (currentLang === 'en' ? '0 events' : '0 eventos')
        : filtered.length === 1 ? (currentLang === 'en' ? '1 event' : '1 evento')
        : filtered.length + (currentLang === 'en' ? ' events' : ' eventos');
      renderEvents(filtered);
    }

    function checkSession() {
      var isLogged = localStorage.getItem('sma_admin_logged') === 'true';
      document.body.classList.toggle('admin-logged', isLogged);
      document.getElementById('lockLabel').innerText = isLogged ? (currentLang === 'en' ? 'Log out' : 'Cerrar Sesión') : (currentLang === 'en' ? 'Admin Access' : 'Acceso Admin');
    }

    function renderEvents(eventsToShow) {
      var container = document.getElementById('eventsContainer');
      var list = eventsToShow || globalEvents;

      if (!list.length) {
        container.innerHTML = '<div class="empty-state"><p>' + (currentLang === 'en' ? 'No upcoming events found.' : 'No hay próximos eventos disponibles.') + '</p></div>';
        return;
      }

      var html = '';
      list.forEach(function(ev) {
        var currentName = currentLang === 'en' ? ev.name_en : ev.name_es;
        var currentCat = currentLang === 'en' ? ev.category_en : ev.category_es;
        var currentPrice = currentLang === 'en' ? ev.price_en : ev.price_es;
        var currentDesc = currentLang === 'en' ? ev.desc_en : ev.desc_es;

        var webButton = (ev.link && ev.link.length > 5)
          ? '<a href="' + ev.link + '" target="_blank" rel="noopener" class="event-web-link">' + (currentLang === 'en' ? 'Official Site / Tickets ↗' : 'Sitio Oficial / Boletos ↗') + '</a>'
          : '';

        html += 
          '<article class="event-card">' +
            '<div class="event-img-wrapper">' +
              '<span class="event-category">' + currentCat + '</span>' +
              '<span class="event-date-badge">' + (ev.shortDate || ev.date) + '</span>' +
              '<div class="admin-card-actions">' +
                '<button class="btn-card-edit" onclick="openEditModal(' + ev.rowIndex + ')" title="Editar">✏️</button>' +
                '<button class="btn-card-delete" onclick="handleDeleteEvent(' + ev.rowIndex + ')" title="Eliminar">🗑️</button>' +
              '</div>' +
              '<img src="' + ev.img + '" alt="' + currentName + '" loading="lazy" onerror="this.src=\'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80\'">' +
            '</div>' +
            '<div class="event-body">' +
              '<h3 class="event-name">' + currentName + '</h3>' +
              '<div class="event-meta">' +
                '<span>📅 ' + ev.date + '</span>' +
                '<span class="meta-sep">·</span>' +
                '<span>🕒 ' + ev.time + '</span>' +
                '<span class="meta-sep">·</span>' +
                '<span class="price">💰 ' + currentPrice + '</span>' +
              '</div>' +
              '<a href="' + ev.mapsUrl + '" target="_blank" rel="noopener" class="event-location">📍 ' + ev.location + '</a>' +
              '<p class="event-desc">' + currentDesc + '</p>' +
              webButton +
            '</div>' +
          '</article>';
      });
      container.innerHTML = '<div class="events-grid">' + html + '</div>';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function closeEventModal() {
      document.getElementById('eventModal').classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLoginModal();
        closeEventModal();
      }
    });

    function openLoginModal() {
      if (localStorage.getItem('sma_admin_logged') === 'true') {
        localStorage.removeItem('sma_admin_logged');
        checkSession();
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    }

    function openEventModal() {
      isEditMode = false;
      document.getElementById('eventModalTitle').textContent = 'Nuevo Evento';
      document.getElementById('submitEventBtn').textContent = 'Guardar Evento';
      document.getElementById('editRowIndex').value = '';
      document.getElementById('eventForm').reset();
      document.getElementById('eventModal').classList.add('active');
    }

    function openEditModal(rowIndex) {
      var event = globalEvents.find(function(ev) { return ev.rowIndex === rowIndex; });
      if (!event) return;
      isEditMode = true;
      document.getElementById('eventModalTitle').textContent = 'Modificar Evento';
      document.getElementById('submitEventBtn').textContent = 'Actualizar Evento';
      document.getElementById('editRowIndex').value = rowIndex;
      document.getElementById('inputImgFile').value = '';

      document.getElementById('inputName').value = event.name_es || '';
      document.getElementById('inputNameEn').value = event.name_en || '';
      document.getElementById('inputCategory').value = event.category_es || '';
      document.getElementById('inputCategoryEn').value = event.category_en || '';
      document.getElementById('inputDate').value = event.rawDate ? event.rawDate.split('T')[0] : '';
      document.getElementById('inputTime').value = event.rawTimeHHMM || '';
      document.getElementById('inputPrice').value = event.price_es || '';
      document.getElementById('inputPriceEn').value = event.price_en || '';
      document.getElementById('inputLocation').value = event.location || '';
      document.getElementById('inputWeb').value = event.link || '';
      document.getElementById('inputImg').value = event.rawImg || '';
      document.getElementById('inputDesc').value = event.desc_es || '';
      document.getElementById('inputDescEn').value = event.desc_en || '';
      document.getElementById('eventModal').classList.add('active');
    }

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('usernameInput').value === AUTH_USER &&
          document.getElementById('passwordInput').value === AUTH_PASS) {
        localStorage.setItem('sma_admin_logged', 'true');
        document.getElementById('loginModal').classList.remove('active');
        checkSession();
      } else {
        alert('Credenciales incorrectas');
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function handleSaveEvent(e) {
      e.preventDefault();
      var btn = document.getElementById('submitEventBtn');
      var originalBtnText = btn.textContent;
      var fileInput = document.getElementById('inputImgFile');
      var urlInputVal = document.getElementById('inputImg').value.trim();

      if (fileInput.files.length === 0 && !urlInputVal) {
        alert('Por favor sube una imagen o pega un enlace.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Subiendo y guardando...';

      var imgBase64 = '';
      var imgName = '';
      if (fileInput.files.length > 0) {
        var file = fileInput.files[0];
        imgName = Date.now() + '_' + file.name;
        imgBase64 = await fileToBase64(file);
      }

      var rawTime = document.getElementById('inputTime').value;
      var formattedTime = rawTime ? rawTime + ' hrs' : '';

      var payload = {
        action: isEditMode ? 'update' : 'add',
        name: document.getElementById('inputName').value,
        name_en: document.getElementById('inputNameEn').value,
        category: document.getElementById('inputCategory').value,
        category_en: document.getElementById('inputCategoryEn').value,
        date: document.getElementById('inputDate').value,
        time: formattedTime,
        price: document.getElementById('inputPrice').value,
        price_en: document.getElementById('inputPriceEn').value,
        location: document.getElementById('inputLocation').value,
        link: sanitizeUrl(document.getElementById('inputWeb').value),
        img: urlInputVal,
        imgBase64: imgBase64,
        imgName: imgName,
        desc: document.getElementById('inputDesc').value,
        desc_en: document.getElementById('inputDescEn').value
      };
      if (isEditMode) payload.rowIndex = parseInt(document.getElementById('editRowIndex').value, 10);

      try {
        var response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        var result = await response.json();
        if (result.status === 'success') {
          document.getElementById('eventModal').classList.remove('active');
          fetchGoogleSheetData();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (err) {
        alert('Problema de conexión al guardar.');
      } finally {
        btn.disabled = false;
        btn.textContent = originalBtnText;
      }
    }

    async function handleDeleteEvent(rowIndex) {
      if (!confirm('¿Eliminar este evento?')) return;
      try {
        var response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
        });
        var result = await response.json();
        if (result.status === 'success') {
          fetchGoogleSheetData();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (err) {
        alert('Fallo de conexión al eliminar.');
      }
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      searchQuery = e.target.value.trim();
      applyFilters();
    });

    window.onclick = function(e) {
      if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('active');
    };

    document.addEventListener('DOMContentLoaded', function() {
      checkSession();
      fetchGoogleSheetData();
    });
  </script>
</body>
</html>
