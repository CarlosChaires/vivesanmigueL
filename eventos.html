<script>
        const eventosRespaldo = [
            {
                titulo: "Festival Internacional Cervantino en SMA",
                descripcion: "Disfruta de expresiones artísticas, música y teatro de clase mundial en los escenario históricos de la ciudad.",
                fecha: "Próximamente",
                lugar: "Centro Histórico",
                costo: "Entrada libre / Variable"
            },
            {
                titulo: "Recorrido de Viñedos y Cata de Altura",
                descripcion: "Vive una experiencia enológica exclusiva con catas guiadas y maridajes en los mejores viñedos de la región.",
                fecha: "Fines de semana",
                lugar: "Viñedos San Lucas / San José la Vista",
                costo: "Desde $800 MXN"
            },
            {
                titulo: "Conciertos en la Parroquia y Jardín Principal",
                descripcion: "Música en vivo, serenatas tradicionales y un ambiente colonial inigualable bajo elAtardecer sanmiguelense.",
                fecha: "Diario por la tarde",
                lugar: "Jardín Principal",
                costo: "Evento gratuito"
            }
        ];

        async function cargarEventosDinamicos() {
            let contenedor = document.getElementById('contenedor-eventos');
            try {
                let respuesta = await fetch('eventos_sma.json?' + new Date().getTime());
                if (!respuesta.ok) throw new Error("No se pudo cargar el JSON");
                let eventos = await respuesta.json();
                
                if (!eventos || eventos.length === 0) {
                    mostrarTarjetas(eventosRespaldo);
                    return;
                }

                mostrarTarjetas(eventos);
            } catch (error) {
                // Si falla o no encuentra el JSON, usa el respaldo instantáneo
                mostrarTarjetas(eventosRespaldo);
            }
        }

        function mostrarTarjetas(lista) {
            let contenedor = document.getElementById('contenedor-eventos');
            contenedor.innerHTML = '';
            lista.forEach(ev => {
                let tarjeta = document.createElement('div');
                tarjeta.className = 'wp-block-column';
                tarjeta.innerHTML = `
                    <div>
                        <h3>${ev.titulo}</h3>
                        <p>${ev.descripcion}</p>
                    </div>
                    <div class="event-meta">
                        📅 ${ev.fecha}<br>
                        📍 ${ev.lugar}<br>
                        💰 ${ev.costo}
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
            inicializarEfecto3D();
        }

        function inicializarEfecto3D() {
            const cards = document.querySelectorAll('.wp-block-column');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -6;
                    const rotateY = ((x - centerX) / centerX) * 6;
                    card.style.transform = `translateY(-6px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.015)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'translateY(0px) rotateX(0deg) rotateY(0deg) scale(1)';
                });
            });
        }

        cargarEventosDinamicos();

        // Control del Aura y Partículas Inmersivas
        const cursorGlow = document.getElementById('cursor-glow');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        const canvas = document.getElementById('immersive-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 5;
                this.vx = Math.random() * 0.4 - 0.2;
                this.vy = Math.random() * 0.4 - 0.2;
                this.color = 'rgba(184, 107, 67, 0.35)';
            }
            update() {
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = 160;
                let force = (maxDistance - distance) / maxDistance;

                if (distance < maxDistance) {
                    this.x -= forceDirectionX * force * this.density * 0.5;
                    this.y -= forceDirectionY * force * this.density * 0.5;
                } else {
                    if (this.x !== this.baseX) {
                        this.x -= (this.x - this.baseX) / 25;
                    }
                    if (this.y !== this.baseY) {
                        this.y -= (this.y - this.baseY) / 25;
                    }
                }

                this.baseX += this.vx;
                this.baseY += this.vy;

                if (this.baseX < 0) this.baseX = width;
                if (this.baseX > width) this.baseX = 0;
                if (this.baseY < 0) this.baseY = height;
                if (this.baseY > height) this.baseY = 0;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (width * height) / 10000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>
