<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Eventos - Vive San Miguel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.96);
            --cantera-terracotta: #b86b43;
            --cantera-rose: #d48384;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-glass: rgba(184, 107, 67, 0.18);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* --- Lienzo de Partículas Discretas e Inmersivas --- */
        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Aura Suave que Sigue el Puntero del Cursor --- */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(212, 131, 132, 0.2) 0%, rgba(184, 107, 67, 0.1) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .sma-main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* --- Cabecera con Logotipo Oficial SIN Círculo (Limpio y en Alta Definición) --- */
        .site-header-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            text-align: center;
        }

        .site-logo-container {
            width: 130px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .site-logo-container:hover {
            transform: scale(1.04);
        }

        .site-logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 8px 20px rgba(184, 107, 67, 0.15));
        }

        .interactive-brand-title {
            font-family: 'Playfair Display', serif, sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--primary-navy);
            text-decoration: none;
            display: block;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .brand-subtitle-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--cantera-terracotta);
            margin-top: 6px;
            font-weight: 700;
            display: block;
        }

        /* --- Botón de Volver al Inicio --- */
        .sma-buttons-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .sma-pastel-btn .wp-block-button__link {
            background: #ffffff !important;
            color: var(--primary-navy) !important;
            border: 1px solid var(--border-glass) !important;
            padding: 12px 30px !important;
            border-radius: 30px !important;
            font-weight: 700 !important;
            font-size: 13.5px !important;
            text-decoration: none !important;
            box-shadow: 0 6px 20px rgba(27, 42, 74, 0.06);
            transition: all 0.3s ease !important;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .sma-pastel-btn .wp-block-button__link:hover {
            background: var(--cantera-terracotta) !important;
            color: #ffffff !important;
            border-color: var(--cantera-terracotta) !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 107, 67, 0.3);
        }

        .wp-block-separator {
            border: none;
            height: 1px;
            background: rgba(184, 107, 67, 0.15);
            margin: 30px 0;
        }

        /* --- Título de Sección --- */
        .header-title-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title-area h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: var(--primary-navy);
            margin-bottom: 10px;
        }

        .header-title-area p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* --- Cuadrícula de Tarjetas Uniformes 3D --- */
        .wp-block-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 3rem;
        }

        .wp-block-column {
            background: var(--surface-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(27, 42, 74, 0.06);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
            position: relative;
            overflow: hidden;
        }

        .wp-block-column:hover {
            transform: translateY(-8px) scale(1.015);
            box-shadow: 0 25px 50px rgba(184, 107, 67, 0.15);
            border-color: var(--cantera-terracotta);
            background: rgba(255, 255, 255, 0.99);
        }

        .wp-block-column h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-navy);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .wp-block-column p {
            color: var(--text-muted) !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            margin: 0 0 20px 0;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--cantera-terracotta);
            font-weight: 600;
            background: rgba(184, 107, 67, 0.06);
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            border: 1px solid rgba(184, 107, 67, 0.1);
        }

        /* --- Footer --- */
        .footer-brand-section {
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
            border-top: 1px solid var(--border-glass);
        }

        .footer-brand-section p {
            font-weight: 800 !important;
            color: var(--primary-navy) !important;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 12px !important;
        }

        @media screen and (max-width: 768px) {
            .sma-main-wrapper { padding: 25px 16px; }
            .site-header-custom { flex-direction: column; gap: 16px; text-align: center; }
            .site-logo-container { width: 110px; }
            .interactive-brand-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <canvas id="immersive-canvas"></canvas>
    <div id="cursor-glow"></div>

    <div class="sma-main-wrapper">

        <header class="site-header-custom">
            <div class="site-logo-container" title="Vive San Miguel">
                <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel">
            </div>
            <div>
                <a href="https://carloschaires.github.io/vivesanmigueL/" class="interactive-brand-title">VIVE SAN MIGUEL</a>
                <span class="brand-subtitle-badge">Guía Turística de San Miguel de Allende</span>
            </div>
        </header>

        <hr class="wp-block-separator has-alpha-channel-opacity" />

        <div class="sma-buttons-container">
            <div class="wp-block-button sma-pastel-btn">
                <a class="wp-block-button__link wp-element-button" href="https://carloschaires.github.io/vivesanmigueL/">← Volver al Inicio</a>
            </div>
        </div>

        <hr class="wp-block-separator has-alpha-channel-opacity" />

        <div class="header-title-area">
            <h2>Agenda Cultural y de Eventos</h2>
            <p>Sincronizada automáticamente en tiempo real con las mejores actividades de la ciudad.</p>
        </div>

        <div id="contenedor-eventos" class="wp-block-columns">
            <p style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">Cargando la cartelera de eventos...</p>
        </div>

        <div class="footer-brand-section">
            <p>vivesanmiguel.com</p>
        </div>

    </div>

                let respuesta = await fetch('eventos_sma.json');
                let eventos = await respuesta.json();

                if (!eventos || eventos.length === 0
