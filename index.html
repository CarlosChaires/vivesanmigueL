<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive Tu Ruta - San Miguel de Allende</title>
    <style>
        /* --- Variables de Diseño y Paleta de Colores --- */
        :root {
            --bg-light: #fdfbf7;          /* Fondo principal suave */
            --white: #ffffff;
            --primary-navy: #1b2a4a;      /* Color principal, elegancia */
            --pastel-terracotta: #e8a87c;   /* Color cálido, artesanal */
            --accent-ochre: #dfc291;      /* Color secundario, dorado suave */
            --text-main: #2c2c2c;         /* Texto principal */
            --text-muted: #666666;         /* Texto secundario, subtítulos */
            --border-color: rgba(0,0,0,0.08); /* Bordes sutiles */
            --shadow-card: 0 6px 20px rgba(0,0,0,0.03);
            --shadow-hover: 0 12px 30px rgba(0,0,0,0.06);
        }

        /* --- Estilos Generales --- */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* --- Contenedor Principal --- */
        .sma-main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        /* --- Cabecera (Header) --- */
        .site-header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--pastel-terracotta);
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        .site-logo {
            width: 130px; /* Aumenté un poco el tamaño para mayor presencia */
            height: auto;
            margin-bottom: 20px;
            display: inline-block;
        }

        h2.wp-block-heading.site-title {
            font-size: 40px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 15px 0;
            color: var(--primary-navy);
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .hero-subtitle {
            text-align: center;
            font-size: 18px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 400;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- Cuadrícula de Contenido (Grid) --- */
        .wp-block-columns.sma-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            margin-top: 30px;
            justify-items: center;
        }

        .wp-block-column.sma-box {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-color);
            width: 100%; /* Asegura que ocupe todo el espacio de su columna en el grid */
        }

        .wp-block-column.sma-box:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        /* --- Imágenes de las tarjetas --- */
        .wp-block-image.sma-img {
            margin: 0 0 25px 0;
            border-radius: 16px;
            overflow: hidden;
            height: 220px;
            position: relative;
        }

        .wp-block-image.sma-img::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.05) 100%);
        }

        .wp-block-image.sma-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .wp-block-column.sma-box:hover .wp-block-image.sma-img img {
            transform: scale(1.07);
        }

        /* --- Botones Principales (CTA) --- */
        .wp-block-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .wp-block-button__link.sma-cta-btn {
            background-color: var(--pastel-terracotta);
            color: var(--white);
            padding: 14px 32px;
            border-radius: 50px; /* Botón completamente redondeado */
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: none;
            box-shadow: 0 6px 15px rgba(232, 168, 124, 0.4);
        }

        .wp-block-button__link.sma-cta-btn:hover {
            background-color: #d6956b;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(232, 168, 124, 0.5);
        }

        /* Icono de corazón latiente */
        .wp-block-button__link.sma-cta-btn::before {
            content: "♥";
            font-size: 18px;
            color: #fff;
            animation: pulse-heart 1.5s infinite;
        }

        @keyframes pulse-heart {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* --- Texto descriptivo de la tarjeta --- */
        p.sma-box-description {
            text-align: center;
            font-size: 15px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.7;
            padding: 0 10px;
        }

        /* --- Nueva Sección: Contacto y Redes Sociales --- */
        .turismo-contact-section {
            margin-top: 80px;
            padding-top: 50px;
            border-top: 2px solid var(--border-color);
            text-align: center;
        }

        .contact-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-navy);
            margin-bottom: 15px;
        }

        .contact-text {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-link {
            display: inline-block;
            font-size: 17px;
            color: var(--primary-navy);
            font-weight: 600;
            margin-bottom: 40px;
            padding: 10px 20px;
            border: 2px solid var(--primary-navy);
            border-radius: 30px;
        }
        .email-link:hover {
             background-color: var(--primary-navy);
             color: var(--white);
        }

        .social-links-turismo {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .social-btn-turismo {
            background-color: var(--primary-navy);
            color: var(--white);
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s, transform 0.3s;
        }
        /* Diferenciación de colores de marca */
        .social-btn-turismo.instagram {
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
        }
        .social-btn-turismo.tiktok {
             background-color: #000; /* O el color de su marca */
        }

        .social-btn-turismo:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

         /* Iconos para botones sociales (opcional, usando emojis o pseudo-elementos) */
        .social-btn-turismo.instagram::before { content: '📸'; font-size: 18px;}
        .social-btn-turismo.tiktok::before { content: '🎵'; font-size: 18px;}

        /* --- Footer --- */
        .site-footer-final {
            margin-top: 70px;
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border-color);
        }

        .footer-domain {
            font-size: 13px;
            opacity: 0.6;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            color: var(--text-main);
        }

        /* --- Estilo Responsivo para Móviles y Tablets --- */
        @media screen and (max-width: 768px) {
            .site-header {
                width: 90%;
            }
            h2.wp-block-heading.site-title {
                font-size: 32px;
            }
            .wp-block-columns.sma-grid {
                grid-template-columns: 1fr; /* Una sola columna en pantallas pequeñas */
            }
            .wp-block-column.sma-box {
                max-width: 100%;
                margin-bottom: 20px;
            }
            .turismo-contact-section {
                padding-top: 30px;
            }
            .social-links-turismo {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
             .social-btn-turismo {
                 width: 80%;
                 justify-content: center;
             }
        }
    </style>
</head>
