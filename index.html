<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel | Experiencia Inmersiva</title>
    <!-- Tipografía moderna y elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #fdfcfb;
            --navy: #1a2a44;
            --terracotta: #b86942;
            --white: #ffffff;
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--navy);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Hero Inmersivo */
        .hero-section {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(26, 42, 68, 0.4), rgba(26, 42, 68, 0.4)), 
                        url('https://vivemigueldeallende.wordpress.com/wp-content/uploads/2026/04/pexels-tiarrasorte-29837357.jpg?w=1024');
            background-size: cover;
            background-position: center;
            color: var(--white);
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* Estilo de Tarjetas Modernas */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 60px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 60px rgba(184, 105, 66, 0.15);
        }

        .btn-cta {
            background: var(--terracotta);
            color: var(--white);
            padding: 20px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div>
            <h1 class="hero-title">San Miguel de Allende</h1>
            <p>Descubre el corazón cultural de México.</p>
            <a href="#rutas" class="btn-cta">Explorar Rutas</a>
        </div>
    </section>

    <div class="card-grid" id="rutas">
        <!-- Ejemplo de componente optimizado -->
        <div class="card">
            <h2>Rutas Icónicas</h2>
            <p>Recorridos por el patrimonio tangible.</p>
        </div>
        <div class="card">
            <h2>Experiencias</h2>
            <p>Tours temáticos y vivenciales[cite: 1].</p>
        </div>
    </div>

</body>
</html>
