<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel | Catálogo de Rutas</title>
    <style>
        :root {
            --navy: #1b2a4a;
            --rose: #d48384;
            --sand: #fcfbfa;
            --white: #ffffff;
        }

        body {
            background-color: var(--sand);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            color: var(--navy);
        }

        .main-container { max-width: 900px; margin: 0 auto; }

        /* Botón de Regreso (Nuevo) */
        .back-nav { margin-bottom: 30px; }
        .btn-back {
            color: var(--navy);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid var(--navy);
            padding: 8px 16px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--navy); color: var(--white); }

        /* Estilo de Tarjetas de Ruta */
        .route-item {
            display: flex;
            align-items: center;
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .route-item:hover { transform: translateY(-5px); }
        
        .route-img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 25px;
        }

        .route-info h3 { margin: 0 0 10px 0; font-family: 'Playfair Display', serif; }
        .btn-view {
            background: var(--rose);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="back-nav">
            <a href="javascript:history.back()" class="btn-back">← VOLVER A LA PÁGINA ANTERIOR</a>
        </div>

        <h1>Explora nuestras Rutas Temáticas</h1>
        <p>Descubre el patrimonio tangible e intangible de San Miguel de Allende.</p>

        <!-- Bloque ejemplo basado en tu reporte -->
        <div class="route-item">
            <img src="https://vivemigueldeallende.wordpress.com/wp-content/uploads/2024/10/image-19.png?w=1024" class="route-img" alt="Museo Casa de Allende">
            <div class="route-info">
                <h3>MUSEO CASA DE ALLENDE</h3>
                <a href="https://vivemigueldeallende.wordpress.com/2024/10/21/museo-ca-de-allende/" class="btn-view">VER DETALLES</a>
            </div>
        </div>

        <!-- Puedes repetir este bloque para cada ruta (Casa Canal, Nigromante, etc.) -->
        <div class="route-item">
            <img src="https://vivemigueldeallende.wordpress.com/wp-content/uploads/2024/10/image.png?w=1024" class="route-img" alt="Casa del Mayorazgo">
            <div class="route-info">
                <h3>CASA DEL MAYORAZGO DE LA CANAL</h3>
                <a href="https://vivemigueldeallende.wordpress.com/2024/10/21/casa-del-mayorazgo-de-la-canal/" class="btn-view">VER DETALLES</a>
            </div>
        </div>
    </div>

</body>
</html>
