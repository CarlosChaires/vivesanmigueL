<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel | Sitios de Interés</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #f6f4f1;
            --surface-color: rgba(255,255,255,.78);
            --surface-card: #ffffff;
            --text-main: #302526;
            --text-muted: #806f72;
            --accent-terracotta: #b76f72;
            --accent-terracotta-dark: #8f5055;
            --accent-pink: #e7ddd9;
            --accent-pink-soft: #eee7e3;
            --border-color: rgba(183,111,114,.16);
            --shadow-soft: 0 14px 45px rgba(71,42,45,.07);
            --shadow-hover: 0 28px 70px rgba(124,72,78,.16);
            --glass: rgba(255,255,255,.58);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 12% 0%, rgba(183,111,114,.045), transparent 24%),
                radial-gradient(circle at 88% 18%, rgba(160,125,105,.035), transparent 26%),
                linear-gradient(135deg, #faf9f7 0%, #f5f3ef 52%, #efede8 100%);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: .16;
            background-image:
                linear-gradient(rgba(70,64,60,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(70,64,60,.035) 1px, transparent 1px);
            background-size: 90px 90px;
            mask-image: linear-gradient(to bottom, black, transparent 70%);
        }

        #immersive-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: .9;
        }

        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, rgba(183,111,114,.075) 0%, rgba(160,125,105,.025) 42%, transparent 72%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(28px);
            mix-blend-mode: multiply;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2rem 3rem;
        }

        header {
            position: sticky;
            top: 18px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6.5rem;
            padding: .95rem 1.15rem .95rem 1.35rem;
            border: 1px solid rgba(255,255,255,.78);
            background: rgba(255,255,255,.64);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(72,45,48,.08);
        }

        header::after {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(183,111,114,.32), transparent);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            text-decoration: none;
        }

        .brand-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 7px 14px rgba(89,55,59,.10));
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -.45px;
        }

        .btn-nav-home {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            padding: 11px 21px;
            border: 1px solid rgba(183,111,114,.18);
            background: rgba(255,255,255,.68);
            border-radius: 999px;
            transition: all .35s ease;
            box-shadow: 0 8px 24px rgba(70,42,45,.05);
        }

        .btn-nav-home:hover {
            background: linear-gradient(135deg, #b76f72, #d58d93);
            color: #fff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(183,111,114,.25);
        }

        .section-header {
            margin: 0 auto 2.8rem;
            text-align: center;
            max-width: 820px;
            animation: reveal .8s ease both;
        }

        .section-header::before {
            content: "SAN MIGUEL DE ALLENDE";
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--accent-terracotta);
            font-size: .64rem;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .section-header h1 {
            font-size: clamp(2.6rem, 6vw, 5.1rem);
            line-height: .98;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -3px;
            margin-bottom: 1rem;
        }

        .section-header h1::first-letter { color: #a96066; }

        .section-header p {
            color: var(--text-muted);
            font-size: clamp(.94rem, 1.5vw, 1.08rem);
            font-weight: 400;
            max-width: 680px;
            margin: auto;
        }

        .search-bar-wrap {
            max-width: 660px;
            margin: 0 auto 4rem;
            position: relative;
        }

        .search-bar-wrap input {
            width: 100%;
            padding: 17px 24px 17px 52px;
            border: 1px solid rgba(183,111,114,.17);
            border-radius: 999px;
            background: rgba(255,255,255,.73);
            backdrop-filter: blur(16px);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: .92rem;
            color: var(--text-main);
            outline: none;
            box-shadow: 0 16px 40px rgba(73,44,47,.07), inset 0 1px 0 rgba(255,255,255,.9);
            transition: .35s ease;
        }

        .search-bar-wrap input::placeholder { color: #a18f92; }

        .search-bar-wrap input:focus {
            border-color: rgba(183,111,114,.45);
            box-shadow: 0 18px 50px rgba(183,111,114,.13), 0 0 0 5px rgba(233,185,192,.15);
            transform: translateY(-1px);
        }

        .search-bar-wrap i {
            position: absolute;
            top: 50%;
            left: 21px;
            transform: translateY(-50%);
            color: var(--accent-terracotta);
            font-size: .92rem;
        }

        .sites-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.35rem;
            margin-bottom: 6rem;
        }

        .site-card {
            position: relative;
            min-height: 0;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(45,39,37,.075);
            box-shadow:
                0 2px 4px rgba(35,30,28,.025),
                0 14px 35px rgba(35,30,28,.055);
            display: flex;
            flex-direction: column;
            transform: translateZ(0);
            transition:
                transform .55s cubic-bezier(.2,.75,.25,1),
                box-shadow .55s ease,
                border-color .4s ease;
            animation: cardReveal .7s ease both;
        }

        .site-card::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 6;
            background: linear-gradient(125deg, rgba(255,255,255,.22), transparent 32%, transparent 72%, rgba(255,255,255,.08));
            opacity: 0;
            transition: opacity .5s ease;
        }

        .site-card::after {
            content: "";
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 0;
            height: 1px;
            background: #b06d70;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .55s cubic-bezier(.2,.75,.25,1);
            z-index: 7;
        }

        .site-card:hover {
            transform: translateY(-8px);
            box-shadow:
                0 10px 24px rgba(35,30,28,.06),
                0 28px 65px rgba(35,30,28,.11);
            border-color: rgba(45,39,37,.14);
        }

        .site-card:hover::before { opacity: 1; }
        .site-card:hover::after { transform: scaleX(1); }

        .card-image-wrap {
            position: relative;
            height: 245px;
            background: #e9e5df;
            overflow: hidden;
        }

        .card-image-wrap::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 18px;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(255,255,255,.58);
            border-radius: 50%;
            z-index: 3;
            opacity: .8;
        }

        .card-image-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom, transparent 46%, rgba(22,19,18,.38) 100%),
                linear-gradient(120deg, rgba(255,255,255,.10), transparent 45%);
            opacity: .68;
            pointer-events: none;
            transition: opacity .5s ease;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .9s cubic-bezier(.2,.7,.2,1), filter .6s ease;
        }

        .site-card:hover .card-image-wrap img {
            transform: scale(1.06);
            filter: saturate(1.04) contrast(1.025);
        }

        .site-card:hover .card-image-wrap::after { opacity: .28; }

        .card-index {
            position: absolute;
            right: 18px;
            top: 18px;
            z-index: 4;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .66rem;
            font-weight: 700;
            letter-spacing: .4px;
            background: rgba(35,30,28,.28);
            border: 1px solid rgba(255,255,255,.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card-label {
            position: absolute;
            left: 20px;
            bottom: 18px;
            z-index: 4;
            color: rgba(255,255,255,.94);
            font-size: .61rem;
            font-weight: 700;
            letter-spacing: 1.35px;
            text-transform: uppercase;
        }

        .site-body {
            position: relative;
            z-index: 4;
            padding: 21px 22px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: #fff;
        }

        .site-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 9px;
            color: #9a8e89;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: 1.05px;
            text-transform: uppercase;
        }

        .site-meta i {
            color: #b06d70;
            font-size: .48rem;
        }

        .site-name {
            font-size: 1.06rem;
            line-height: 1.3;
            font-weight: 700;
            color: #2f2928;
            margin: 0 0 18px;
            letter-spacing: -.5px;
        }

        .site-actions {
            margin-top: auto;
            display: block;
        }

        .btn-action {
            width: 100%;
            min-height: 47px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 7px 7px 14px;
            border-radius: 13px;
            border: 1px solid #e5dfdb;
            font-weight: 700;
            font-size: .68rem;
            letter-spacing: .55px;
            text-transform: uppercase;
            text-decoration: none;
            transition:
                background .35s ease,
                border-color .35s ease,
                color .35s ease,
                transform .35s ease,
                box-shadow .35s ease;
            background: #fff;
            color: #342e2c;
            box-shadow: 0 3px 12px rgba(35,30,28,.035);
        }

        .btn-action > span:first-child {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }

        .btn-action > span:first-child i {
            color: #9b5e61;
            font-size: .76rem;
        }

        .btn-arrow {
            width: 33px;
            height: 33px;
            flex: 0 0 33px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: #302a28;
            color: #fff;
            transition: transform .35s ease, background .35s ease;
        }

        .btn-action:hover {
            background: #faf8f6;
            border-color: #cfc5bf;
            color: #2f2928;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(47,41,39,.08);
        }

        .btn-action:hover .btn-arrow {
            background: #9d6063;
            transform: translateX(2px);
        }

        .admin-bar {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-bottom: 3rem;
            background: rgba(255,255,255,.70);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(183,111,114,.15);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(15px);
        }

        .admin-bar.active { display: flex; flex-wrap: wrap; align-items: center; }

        .btn-admin {
            background: rgba(183,111,114,.07);
            color: var(--accent-terracotta);
            border: 1px solid rgba(183,111,114,.17);
            padding: 7px 16px;
            border-radius: 999px;
            font-weight: 700;
            font-size: .72rem;
            cursor: pointer;
            transition: .3s ease;
        }

        .btn-admin:hover {
            background: var(--accent-terracotta);
            color: #fff;
            transform: translateY(-1px);
        }

        footer {
            border-top: 1px solid rgba(183,111,114,.13);
            padding: 2.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .78rem;
            color: var(--text-muted);
        }

        .admin-trigger {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: .72rem;
            cursor: pointer;
            padding: 7px 14px;
            border-radius: 20px;
            transition: .3s ease;
            opacity: .65;
        }

        .admin-trigger:hover {
            opacity: 1;
            color: var(--accent-terracotta);
            background: rgba(183,111,114,.07);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(48,37,38,.42);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all .35s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: rgba(255,255,255,.90);
            width: 100%;
            max-width: 450px;
            border-radius: 28px;
            padding: 2.2rem;
            border: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 30px 90px rgba(48,37,38,.20);
            backdrop-filter: blur(25px);
            transform: translateY(18px) scale(.98);
            transition: all .35s ease;
        }

        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-top h3 { font-size: 1.25rem; font-weight: 700; }

        .close-btn {
            background: rgba(183,111,114,.08);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: .25s ease;
        }

        .close-btn:hover { background: var(--accent-terracotta); color: #fff; transform: rotate(90deg); }

        .input-group { margin-bottom: 1.2rem; }

        .input-group label {
            display: block;
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: .4rem;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: .85rem 1rem;
            border: 1px solid rgba(183,111,114,.15);
            border-radius: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: .88rem;
            background: rgba(251,246,247,.85);
            color: var(--text-main);
            outline: none;
            transition: .25s ease;
        }

        .input-group input:focus {
            border-color: rgba(183,111,114,.48);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(233,185,192,.15);
        }

        .btn-modal-save {
            background: linear-gradient(135deg, #a96066, #c47a80);
            color: #fff;
            border: none;
            width: 100%;
            padding: .9rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: .82rem;
            cursor: pointer;
            transition: .3s ease;
            margin-top: .5rem;
            box-shadow: 0 12px 25px rgba(169,96,102,.20);
        }

        .btn-modal-save:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(169,96,102,.28); }

        .error-message {
            color: #b44747;
            font-size: .82rem;
            margin-top: .5rem;
            display: none;
        }

        .sma-atmosphere {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .sma-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: .055;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        .sma-orb-a {
            width: 360px;
            height: 360px;
            left: -120px;
            top: 24%;
            background: #e9b9c0;
        }

        .sma-orb-b {
            width: 300px;
            height: 300px;
            right: -80px;
            top: 52%;
            background: #d9a59d;
            animation-delay: -5s;
        }

        .sma-orb-c {
            width: 220px;
            height: 220px;
            left: 42%;
            top: -100px;
            background: #f0cfd4;
            animation-delay: -9s;
        }

        @keyframes floatOrb {
            from { transform: translate3d(0,0,0) scale(1); }
            to { transform: translate3d(35px,-24px,0) scale(1.12); }
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .sites-grid { grid-template-columns: repeat(2, 1fr); }
            header { margin-bottom: 5rem; }
        }

        @media (max-width: 640px) {
            .container { padding: 1rem 1rem 2rem; }
            header { top: 10px; margin-bottom: 4rem; padding: .8rem 1rem; }
            .brand-name { display: none; }
            .section-header h1 { letter-spacing: -2px; }
            .sites-grid { grid-template-columns: 1fr; gap: 1.25rem; }
            .site-card { min-height: 390px; }
            .card-image-wrap { height: 225px; }
            footer { flex-direction: column; gap: 1rem; text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
            #cursor-glow { display: none; }
        }
    </style>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sma-atmosphere" aria-hidden="true">
        <span class="sma-orb sma-orb-a"></span>
        <span class="sma-orb sma-orb-b"></span>
        <span class="sma-orb sma-orb-c"></span>
    </div>
    <canvas id="immersive-canvas"></canvas>
    <div id="cursor-glow"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <a href="https://carloschaires.github.io/vivesanmigueL/" class="brand">
                <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel" class="brand-logo" onerror="this.style.display='none'">
                <span class="brand-name">Vive San Miguel</span>
            </a>
            <a href="https://carloschaires.github.io/vivesanmigueL/" class="btn-nav-home">Inicio</a>
        </header>

        <!-- Admin Bar -->
        <div class="admin-bar" id="adminControls">
            <button class="btn-admin" onclick="downloadSitesTemplate()">📥 Descargar Plantilla</button>
            <button class="btn-admin" onclick="document.getElementById('excelFileInput').click()">📂 Subir Masivo Excel</button>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="handleSitesExcelUpload(event)">
            <span class="sync-status" id="syncStatus" style="font-size:0.75rem; color:#0F9D58; font-weight:600;"><i class="fas fa-check-circle"></i> Sincronizado</span>
            <button class="btn-admin" onclick="logoutAdmin()" style="border-color: #c0392b; color: #c0392b;">Cerrar Sesión</button>
        </div>

        <!-- Título de la Sección -->
        <div class="section-header">
            <h1>Sitios de Interés</h1>
            <p>Conoce los recintos, monumentos y lugares más emblemáticos de San Miguel de Allende.</p>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="search-bar-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Busca por nombre de sitio..." oninput="handleSearch()">
        </div>

        <!-- Grid de Sitios de Interés -->
        <div class="sites-grid" id="sitesGridContainer"></div>

        <!-- Footer -->
        <footer>
            <span>Vive San Miguel — Tu Guía de Confianza</span>
            <button class="admin-trigger" onclick="openLoginModal()">🔒 Admin</button>
        </footer>
    </div>

    <!-- Modales -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <div class="modal-top">
                <h3>Acceso Restringido</h3>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="usernameInput" required placeholder="Usuario">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>

        function getStoredSites() {
            const data = localStorage.getItem('sma_sitios_interes_v6');
            if (!data) {
                localStorage.setItem('sma_sitios_interes_v6', JSON.stringify(defaultSitesData));
                return defaultSitesData;
            }
            return JSON.parse(data);
        }

        function saveStoredSites(data, syncCloud = true) {
            localStorage.setItem('sma_sitios_interes_v6', JSON.stringify(data));
            renderSites(document.getElementById('searchInput').value);
            if (syncCloud) {
                pushDataToGoogleSheets(data);
            }
        }

        async function pushDataToGoogleSheets(data) {
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data.sites)
                });
            } catch (err) {
                console.error("Error al sincronizar con Google Sheets:", err);
            }
        }

        function checkSession() {
            const isLogged = localStorage.getItem('sma_admin_logged') === 'true';
            const controls = document.getElementById('adminControls');
            if (isLogged) {
                controls.classList.add('active');
            } else {
                controls.classList.remove('active');
            }
        }

        function handleSearch() {
            renderSites(document.getElementById('searchInput').value);
        }

        function renderSites(searchQuery = '') {
            const data = getStoredSites();
            const isLogged = localStorage.getItem('sma_admin_logged') === 'true';
            const container = document.getElementById('sitesGridContainer');
            container.innerHTML = '';

            let filtered = data.sites;
            if (searchQuery && searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(s => s.title.toLowerCase().includes(q));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem;">No se encontraron sitios con esa búsqueda.</p>`;
                return;
            }

            filtered.forEach((s, index) => {
                container.innerHTML += `
                    <article class="site-card" style="animation-delay:${Math.min(index * 0.055, 0.5)}s;">
                        <div class="card-image-wrap">
                            <img src="${s.img}" alt="${s.title}">
                            <span class="card-index">${String(index + 1).padStart(2, '0')}</span>
                            <span class="card-label">San Miguel de Allende</span>
                        </div>
                        <div class="site-body">
                            <div class="site-meta">
                                <i class="fas fa-circle"></i>
                                <span>Sitio de interés</span>
                            </div>
                            <h3 class="site-name">${s.title}</h3>
                            <div class="site-actions">
                                <a href="${s.link}" class="btn-action">
                                    <span><i class="fas fa-book-open"></i> Explorar sitio</span>
                                    <span class="btn-arrow"><i class="fas fa-arrow-up-right-from-square"></i></span>
                                </a>
                                ${isLogged ? `<button class="btn-admin" style="width:100%; margin-top:8px;" onclick="openEditSiteModal('${s.key}')">✏️ Editar Sitio</button>` : ''}
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        function openLoginModal() {
            if (localStorage.getItem('sma_admin_logged') === 'true') {
                if (confirm("¿Desea cerrar la sesión de administración?")) {
                    logoutAdmin();
                }
                return;
            }
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('usernameInput').value === AUTH_USER && document.getElementById('passwordInput').value === AUTH_PASS) {
                localStorage.setItem('sma_admin_logged', 'true');
                closeLoginModal();
                checkSession();
                renderSites(document.getElementById('searchInput').value);
                alert('¡Sesión iniciada con éxito!');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('sma_admin_logged');
            checkSession();
            renderSites(document.getElementById('searchInput').value);
            alert('Sesión cerrada.');
        }

        let currentEditingKey = null;
        function openEditSiteModal(key) {
            const data = getStoredSites();
            const s = data.sites.find(el => el.key === key);
            if (!s) return;
            currentEditingKey = key;
            document.getElementById('editSiteKey').value = key;
            document.getElementById('editTitle').value = s.title;
            document.getElementById('editLink').value = s.link;
            document.getElementById('editImg').value = s.img;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEditedSite(e) {
            e.preventDefault();
            const data = getStoredSites();
            const index = data.sites.findIndex(el => el.key === currentEditingKey);
            if (index !== -1) {
                data.sites[index].title = document.getElementById('editTitle').value;
                data.sites[index].link = document.getElementById('editLink').value;
                data.sites[index].img = document.getElementById('editImg').value;
                saveStoredSites(data, true);
                closeEditModal();
                alert('¡Sitio actualizado con éxito!');
            }
        }

        function downloadSitesTemplate() {
            const data = getStoredSites();
            const flatData = data.sites.map(el => ({
                titulo: el.title,
                enlace: el.link,
                imagen_url: el.img
            }));
            const worksheet = XLSX.utils.json_to_sheet(flatData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "SitiosInteres");
            XLSX.writeFile(workbook, "plantilla_sitios_vivesanmiguel.xlsx");
        }

        function handleSitesExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const dataArr = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(dataArr, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    if (json.length > 0) {
                        const data = getStoredSites();
                        json.forEach((row, idx) => {
                            if (idx < data.sites.length) {
                                if (row.titulo) data.sites[idx].title = row.titulo;
                                if (row.enlace) data.sites[idx].link = row.enlace;
                                if (row.imagen_url) data.sites[idx].img = row.imagen_url;
                            }
                        });
                        saveStoredSites(data, true);
                        alert('¡Importación masiva completada!');
                    }
                } catch (err) {
                    alert('Error al procesar el archivo Excel.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
            renderSites();
        });

        // Partículas interactivas de cursor y canvas
        const cursorGlow = document.getElementById('cursor-glow');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        const canvas = document.getElementById('immersive-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 5;
                this.vx = Math.random() * 0.4 - 0.2;
                this.vy = Math.random() * 0.4 - 0.2;
                this.color = Math.random() > 0.55 ? 'rgba(183, 111, 114, 0.16)' : 'rgba(222, 170, 177, 0.13)';
            }
            update() {
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let maxDistance = 150;
                if (distance < maxDistance) {
                    let force = (maxDistance - distance) / maxDistance;
                    this.x -= (dx / distance) * force * this.density * 0.4;
                    this.y -= (dy / distance) * force * this.density * 0.4;
                } else {
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 25;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 25;
                }
                this.baseX += this.vx;
                this.baseY += this.vy;
                if (this.baseX < 0 || this.baseX > width) this.baseX = Math.random() * width;
                if (this.baseY < 0 || this.baseY > height) this.baseY = Math.random() * height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < (width * height) / 16500; i++) particles.push(new Particle());
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
