<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel - Experiencias</title>
    <style>
        :root {
            --bg-sanmiguel: #fcfbfa;
            --primary-navy: #1b2a4a;
            --cantera-rose: #d48384;
            --white: #ffffff;
        }

        /* Botón de navegación estética */
        .sma-back-nav {
            padding: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .btn-back {
            background: transparent;
            color: var(--primary-navy);
            border: 1px solid var(--primary-navy);
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--primary-navy);
            color: var(--white);
        }

        /* Estilo base heredado */
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-sanmiguel); }
        .sma-main-wrapper { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        /* Ajuste de título */
        .site-header-custom { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .interactive-brand-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--primary-navy); text-decoration: none; }
    </style>
</head>
<body>

    <div class="sma-main-wrapper">
        <!-- Navegación de retorno -->
        <nav class="sma-back-nav">
            <a href="javascript:history.back()" class="btn-back">← VOLVER</a>
        </nav>

        <header class="site-header-custom">
            <div class="site-logo-container">
                <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel">
            </div>
            <a href="#" class="interactive-brand-title">VIVE SAN MIGUEL</a>
        </header>

        <!-- Contenido principal de la ruta aquí -->
        <section class="ruta-contenido">
            <h2>Detalle de la Ruta</h2>
            <p>Explora la magia de nuestra ciudad...</p>
        </section>
    </div>

</body>
</html>
