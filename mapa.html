<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Rutas Temáticas - San Miguel de Allende</title>
    <style>
        :root {
            --primary-navy: #1b2a4a;
            --cantera-terracotta: #c87d55;
            --bg-sand: #fcfbfa;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-sand);
            color: #2c2c2c;
        }

        .mapa-section {
            background-color: var(--white);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.05);
            margin: 40px auto;
            max-width: 900px;
            border: 1px solid rgba(200, 125, 85, 0.15);
            box-sizing: border-box;
        }

        .mapa-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .mapa-header h2 {
            color: var(--primary-navy);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .mapa-header p {
            color: #666666;
            font-size: 15px;
            margin: 0;
        }

        .mapa-image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--cantera-terracotta);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            background-color: #f4ebd0;
        }

        .mapa-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .mapa-btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn-catalogo {
            background-color: var(--primary-navy);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-catalogo:hover {
            background-color: var(--cantera-terracotta);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <section class="mapa-section">
        <div class="mapa-header">
            <h2>Mapa General de Turismo</h2>
            <p>Plano oficial de ubicación y puntos de interés del destino.</p>
        </div>
        
        <div class="mapa-image-container">
            <!-- Imagen oficial del mapa general -->
            <img src="80dc52_98b18d95fb7c4449a9d939d042c6fbe0 (1)_page-0001.jpg" alt="Mapa Turístico Oficial San Miguel de Allende">
        </div>

        <div class="mapa-btn-container">
            <a href="https://canva.link/h47a7syz9r9e9wy" target="_blank" class="btn-catalogo">
                📄 Ver / Descargar Catálogo Completo
            </a>
        </div>
    </section>

</body>
</html>
