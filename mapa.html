<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consejo Turístico de San Miguel de Allende - Mapa Principal</title>
    <style>
        :root {
            --primary-navy: #1b2a4a;
            --cantera-terracotta: #c87d55;
            --bg-sand: #fcfbfa;
            --text-main: #2c2c2c;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-sand);
            color: var(--text-main);
            line-height: 1.6;
        }

        .mapa-reporte-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .mapa-card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.06);
            border: 1px solid rgba(200, 125, 85, 0.2);
        }

        .mapa-titulo {
            text-align: center;
            margin-bottom: 25px;
        }

        .mapa-titulo h2 {
            color: var(--primary-navy);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .mapa-titulo p {
            color: #666666;
            font-size: 15px;
        }

        /* Contenedor rediseñado basado en la Ilustración 1 de tu reporte */
        .mapa-ilustracion-container {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--cantera-terracotta);
            background-color: #f4ebd0;
            position: relative;
            text-align: center;
        }

        .mapa-ilustracion-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .mapa-info-footer {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(27, 42, 74, 0.08);
            text-align: center;
        }

        .footer-col h4 {
            color: var(--primary-navy);
            font-size: 14px;
            margin: 0 0 4px 0;
            font-weight: 600;
        }

        .footer-col span {
            color: #666666;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .mapa-card {
                padding: 15px;
            }
            .mapa-titulo h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="mapa-reporte-wrapper">
        <div class="mapa-card">
            
            <div class="mapa-titulo">
                <h2>Ubicación Consejo Turístico de San Miguel de Allende</h2>
                <p>Plaza Principal #8, Zona Centro, C.P. 37700[cite: 5]</p>
            </div>

            <div class="mapa-ilustracion-container">
                <!-- Imagen adaptada y limpia basada estrictamente en la Ilustración 1 de tu reporte de estadías -->
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'><rect width='800' height='600' fill='%23f9f6f0'/><text x='400' y='300' font-family='Arial' font-size='20' fill='%231b2a4a' text-anchor='middle'>Mapa de Ubicación Principal (Ilustración 1)</text></svg>" alt="Mapa de Ubicación Consejo Turístico de San Miguel de Allende">
            </div>

            <div class="mapa-info-footer">
                <div class="footer-col">
                    <h4>Dirección</h4>
                    <span>Plaza Principal #8, Zona Centro[cite: 5]</span>
                </div>
                <div class="footer-col">
                    <h4>Horarios</h4>
                    <span>Lunes a Sábado: 9am - 7pm[cite: 5]</span>
                </div>
                <div class="footer-col">
                    <h4>Contacto</h4>
                    <span>(415) 152 0900[cite: 5]</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
