<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Turismo de San Miguel de Allende</title>
    <style>
        :root {
            --primary-navy: #1b2a4a;
            --cantera-terracotta: #c87d55;
            --bg-sand: #fcfbfa;
            --text-main: #2c2c2c;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-sand);
            color: var(--text-main);
            line-height: 1.6;
        }

        .mapa-turistico-sma {
            background-color: var(--white);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.05);
            margin: 40px auto;
            max-width: 900px;
            border: 1px solid rgba(200, 125, 85, 0.15);
            box-sizing: border-box;
        }

        .map-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .map-header h2 {
            color: var(--primary-navy);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .map-header p {
            color: #666666;
            font-size: 15px;
        }

        .map-frame img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            border: 2px solid var(--cantera-terracotta);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .download-section {
            text-align: center;
            margin-top: 30px;
        }

        .btn-descargable {
            background-color: var(--primary-navy);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-descargable:hover {
            background-color: var(--cantera-terracotta);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <section class="mapa-turistico-sma">
        <div class="map-header">
            <h2>Mapa de Turismo de San Miguel de Allende</h2>
            <p>Plano general de ubicación y puntos de interés del destino[cite: 5].</p>
        </div>
        
        <div class="map-container-clean">
            <div class="map-frame">
                <!-- Imagen oficial del plano turístico integrado -->
                <img src="80dc52_98b18d95fb7c4449a9d939d042c6fbe0 (1)_page-0001.jpg" alt="Mapa Turístico Oficial San Miguel de Allende">
            </div>
        </div>

        <div class="download-section">
            <a href="https://canva.link/h47a7syz9r9e9wy" target="_blank" class="btn-descargable">
                📄 Ver / Descargar Catálogo Completo (PDF)
            </a>
        </div>
    </section>

</body>
</html>
