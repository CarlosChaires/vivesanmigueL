<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Casa de Allende - Vive San Miguel de Allende</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.88);
            --cantera-terracotta: #b86b43;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-subtle: rgba(184, 107, 67, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
        }

        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* --- Header inmersivo --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .btn-home {
            background: var(--white);
            border: 1px solid var(--border-subtle);
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--primary-navy);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .social-links { display: flex; gap: 10px; }
        .social-btn {
            width: 38px; height: 38px;
            background: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--primary-navy); font-weight: 700; font-size: 12px;
        }

        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-img { width: 100px; height: 100px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* --- Estilo de Tarjetas --- */
        .content-card {
            background: var(--surface-glass);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 40px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .img-featured { width: 100%; border-radius: 20px; margin-bottom: 30px; }
        
        .btn-main {
            display: block;
            width: fit-content;
            margin: 30px auto;
            background: var(--cantera-terracotta);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <canvas id="immersive-canvas"></canvas>

    <div class="wrapper">
        <div class="top-action-bar">
            <a href="#" class="btn-home">Inicio</a>
            <div class="social-links">
                <a href="#" class="social-btn">IG</a>
                <a href="#" class="social-btn">TK</a>
            </div>
        </div>

        <div class="logo-section">
            <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" class="logo-img" alt="Logo">
        </div>

        <div class="content-card">
            <img src="https://vivemigueldeallende.wordpress.com/wp-content/uploads/2024/10/image-19.png?w=1024" class="img-featured" alt="Museo">
            <h1>Museo Casa de Allende</h1>
            <p>El Museo Histórico de San Miguel de Allende ocupa una casa habitación del siglo XVIII... (Contenido aquí)</p>
            <a href="#" class="btn-main">MUSEO CASA DE ALLENDE</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('immersive-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.vx = Math.random() * 0.2 - 0.1;
                this.vy = Math.random() * 0.2 - 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(184, 107, 67, 0.2)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0,0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
