<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel | Aventura y Experiencias al Aire Libre</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#A64B2A">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #FBF4F1;
            --surface-color: #FFFFFF;
            --surface-card: #FFFFFF;
            --text-main: #2D2422;
            --text-muted: #7A6B67;
            --accent-terracotta: #A64B2A;
            --accent-terracotta-dark: #82381C;
            --whatsapp-green: #25D366;
            --whatsapp-dark: #1EBE5D;
            --border-color: rgba(166, 75, 42, 0.12);
            --shadow-soft: 0 10px 30px rgba(45, 36, 34, 0.04);
            --shadow-hover: 0 20px 40px rgba(166, 75, 42, 0.1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(166, 75, 42, 0.08) 0%, rgba(212, 163, 148, 0.04) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(35px);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            padding: 1.2rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .header-actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
        }

        .lang-btn:hover {
            border-color: var(--accent-terracotta);
            color: var(--accent-terracotta);
        }

        .btn-nav-home {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 24px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
        }

        .btn-nav-home:hover {
            background-color: var(--accent-terracotta);
            color: #ffffff;
            border-color: var(--accent-terracotta);
        }

        /* --- Admin Bar --- */
        .admin-bar {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
            background: var(--surface-color);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
        }

        .admin-bar.active {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-admin {
            background: rgba(166, 75, 42, 0.05);
            color: var(--accent-terracotta);
            border: 1px solid rgba(166, 75, 42, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-admin:hover {
            background: var(--accent-terracotta);
            color: #ffffff;
        }

        /* --- Títulos y Buscador --- */
        .section-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .section-header h1 {
            font-size: clamp(2.2rem, 4vw, 2.8rem);
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        .search-bar-wrap {
            max-width: 600px;
            margin: 0 auto 3rem auto;
            position: relative;
        }

        .search-bar-wrap input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            background: var(--surface-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            box-shadow: var(--shadow-soft);
            transition: border-color 0.3s ease;
        }

        .search-bar-wrap input:focus {
            border-color: var(--accent-terracotta);
        }

        .search-bar-wrap i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- Grid de Aventura --- */
        .adventure-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.2rem;
            margin-bottom: 5rem;
        }

        .adventure-card {
            background: var(--surface-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s ease;
        }

        .adventure-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(166, 75, 42, 0.25);
        }

        .carousel-container {
            position: relative;
            height: 220px;
            background: #F4EBE6;
            overflow: hidden;
        }

        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
            z-index: 5;
        }

        .carousel-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }

        .specialties-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-terracotta);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 5;
            max-width: 65%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(45, 36, 34, 0.85);
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ffffff;
            z-index: 5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .adventure-body {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .adventure-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .adventure-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .activities-list {
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .activity-pill {
            background: rgba(166, 75, 42, 0.08);
            color: var(--accent-terracotta-dark);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(166, 75, 42, 0.15);
        }

        .adventure-meta {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 8px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .meta-item i {
            color: var(--accent-terracotta);
            width: 16px;
            text-align: center;
            margin-top: 3px;
        }

        .meta-item:hover {
            color: var(--accent-terracotta);
        }

        .adventure-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-action.map {
            background: rgba(166, 75, 42, 0.08);
            color: var(--accent-terracotta);
            border: 1px solid rgba(166, 75, 42, 0.2);
        }

        .btn-action.map:hover {
            background: var(--accent-terracotta);
            color: #ffffff;
        }

        .btn-action.web {
            background: var(--text-main);
            color: #ffffff;
        }

        .btn-action.web:hover {
            background: var(--accent-terracotta-dark);
        }

        .social-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-social {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-social.facebook {
            background: rgba(24, 119, 242, 0.1);
            color: #1877F2;
            border: 1px solid rgba(24, 119, 242, 0.2);
        }

        .btn-social.facebook:hover {
            background: #1877F2;
            color: #ffffff;
        }

        .btn-social.instagram {
            background: rgba(225, 48, 108, 0.1);
            color: #E1306C;
            border: 1px solid rgba(225, 48, 108, 0.2);
        }

        .btn-social.instagram:hover {
            background: #E1306C;
            color: #ffffff;
        }

        .btn-action.whatsapp {
            width: 100%;
            background-color: var(--whatsapp-green);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .btn-action.whatsapp:hover {
            background-color: var(--whatsapp-dark);
            transform: translateY(-1px);
        }

        /* --- Footer --- */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 2.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .admin-trigger {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .admin-trigger:hover {
            opacity: 1;
            color: var(--accent-terracotta);
            background: rgba(166, 75, 42, 0.05);
        }

        /* --- Modales --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 36, 34, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: translateY(15px);
            transition: all 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-top h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-terracotta);
            background: #ffffff;
        }

        .image-input-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .image-input-box input[type="text"] {
            flex: 1;
        }

        .image-input-box input[type="file"] {
            display: none;
        }

        .btn-upload-file {
            background: rgba(166, 75, 42, 0.1);
            color: var(--accent-terracotta);
            border: 1px solid rgba(166, 75, 42, 0.2);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .btn-upload-file:hover {
            background: var(--accent-terracotta);
            color: #fff;
        }

        .btn-modal-save {
            background: var(--accent-terracotta);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-modal-save:hover {
            background: var(--accent-terracotta-dark);
        }

        .error-message {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        @media (max-width: 1024px) {
            .adventure-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .adventure-grid {
                grid-template-columns: 1fr;
            }
            footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <canvas id="immersive-canvas"></canvas>
    <div id="cursor-glow"></div>

    <div class="container">

        <!-- Header -->
        <header>
            <a href="https://carloschaires.github.io/vivesanmigueL/" class="brand">
                <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel" class="brand-logo" onerror="this.style.display='none'">
                <span class="brand-name">Vive San Miguel</span>
            </a>
            <div class="header-actions-right">
                <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">EN</button>
                <a href="https://carloschaires.github.io/vivesanmigueL/" class="btn-nav-home" id="navHomeText">Inicio</a>
            </div>
        </header>

        <!-- Admin Bar -->
        <div class="admin-bar" id="adminControls">
            <button class="btn-admin" onclick="downloadAdventureTemplate()">📥 Descargar Plantilla</button>
            <button class="btn-admin" onclick="document.getElementById('excelFileInput').click()">📂 Subir Masivo Excel</button>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="handleAdventureExcelUpload(event)">
            <button class="btn-admin" onclick="syncWithGoogleDrive()" style="background: rgba(52, 168, 83, 0.1); color: #34A853; border-color: rgba(52, 168, 83, 0.3);">☁️ Sincronizar Google Drive</button>
            <span class="sync-status" id="syncStatus" style="font-size:0.75rem; color:#0F9D58; font-weight:600;"><i class="fas fa-check-circle"></i> Sincronizado</span>
            <button class="btn-admin" onclick="logoutAdmin()" style="border-color: #c0392b; color: #c0392b;">Cerrar Sesión</button>
        </div>

        <!-- Título de la Sección -->
        <div class="section-header">
            <h1 id="mainTitle">Aventura y Experiencias al Aire Libre</h1>
            <p id="mainSubtitle">Descubre cabalgatas, cañadas, cuatrimotos y expediciones inolvidables en San Miguel de Allende.</p>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="search-bar-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Busca por nombre, actividad o categoría..." oninput="handleSearch()">
        </div>

        <!-- Grid de Aventura -->
        <div class="adventure-grid" id="adventureGridContainer"></div>

        <!-- Footer -->
        <footer>
            <span id="footerText1">Vive San Miguel — Tu Guía de Confianza</span>
            <button class="admin-trigger" onclick="openLoginModal()">🔒 Admin</button>
        </footer>

    </div>

    <!-- Modales -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <div class="modal-top">
                <h3>Acceso Restringido</h3>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="usernameInput" required placeholder="Usuario">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="passwordInput" required placeholder="Contraseña">
                </div>
                <div class="error-message" id="loginError">Credenciales incorrectas. Intente nuevamente.</div>
                <button type="submit" class="btn-modal-save">Ingresar</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-top">
                <h3 id="editModalTitle">Editar Actividad</h3>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form onsubmit="saveEditedAdventure(event)">
                <input type="hidden" id="editAdvKey">
                <div class="input-group">
                    <label>Nombre de la Actividad</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="input-group">
                    <label>Categoría (ES)</label>
                    <input type="text" id="editType" required placeholder="Ej. Expediciones...">
                </div>
                <div class="input-group">
                    <label>Category (EN)</label>
                    <input type="text" id="editTypeEn" required placeholder="Ex. Expeditions...">
                </div>
                <div class="input-group">
                    <label>Especialidades (ES - separadas por comas)</label>
                    <input type="text" id="editSpecialties" required placeholder="Ej. Cabalgatas, Rapel">
                </div>
                <div class="input-group">
                    <label>Specialties (EN - comma separated)</label>
                    <input type="text" id="editSpecialtiesEn" required placeholder="Ex. Horseback Riding, Canyons">
                </div>
                <div class="input-group">
                    <label>Descripción (ES)</label>
                    <textarea id="editDesc" rows="3" required placeholder="Breve descripción..."></textarea>
                </div>
                <div class="input-group">
                    <label>Description (EN)</label>
                    <textarea id="editDescEn" rows="3" required placeholder="Short description..."></textarea>
                </div>
                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="text" id="editPhone" required>

            const data = localStorage.getItem('sma_adventures_data_v12');

                return defaultAdventureData;
            }
            return JSON.parse(data);
        }

        function saveStoredAdventures(data, syncCloud = true) {
            localStorage.setItem('sma_adventures_data_v12', JSON.stringify(data));
            renderAdventures(document.getElementById('searchInput').value);
            if (syncCloud) {
                pushDataToGoogleSheets(data);
            }
        }

        async function pushDataToGoogleSheets(data) {
            try {
                const payload = data.adventures.map(item => ({
                    key: item.key,
                    name: item.name,
                    type: typeof item.type === 'object' ? item.type.es : item.type,
                    type_en: typeof item.type === 'object' ? item.type.en : '',
                    specialties: typeof item.specialties === 'object' && item.specialties.es ? item.specialties.es.join(', ') : item.specialties,
                    specialties_en: typeof item.specialties === 'object' && item.specialties.en ? item.specialties.en.join(', ') : '',
                    desc: typeof item.desc === 'object' ? item.desc.es : item.desc,
                    desc_en: typeof item.desc === 'object' ? item.desc.en : '',
                    phone: item.phone,
                    address: item.address,
                    maps: item.maps,
                    web: item.web,
                    facebook: item.facebook || '#',
                    instagram: item.instagram || '#',
                    whatsapp: item.whatsapp || '',
                    images: Array.isArray(item.images) ? JSON.stringify(item.images) : item.images
                }));

                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Error al sincronizar con Google Sheets:", err);
            }
        }

        async function fetchAdventuresFromCloud() {
            const statusEl = document.getElementById('syncStatus');
            try {
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sincronizando...`;
                
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const cloudData = await response.json();
                
                if (Array.isArray(cloudData) && cloudData.length > 0) {
                    const normalizedAdventures = cloudData.map(item => {
                        let imgs = item.images;
                        if (typeof imgs === 'string') {
                            try { imgs = JSON.parse(imgs); } catch(e) { imgs = imgs.split(',').map(s => s.trim()); }
                        }
                        if (!Array.isArray(imgs)) imgs = ['https://images.unsplash.com/photo-1518709268805-4e9042af9f23'];

                        let specsEs = item.specialties;
                        if (typeof specsEs === 'string') specsEs = specsEs.split(',').map(s => s.trim()).filter(s => s);
                        if (!Array.isArray(specsEs)) specsEs = ['Aventura'];

                        let specsEn = item.specialties_en;
                        if (typeof specsEn === 'string') specsEn = specsEn.split(',').map(s => s.trim()).filter(s => s);
                        if (!Array.isArray(specsEn) || specsEn.length === 0) specsEn = specsEs;

                        return {
                            key: item.key || 'adv_' + Math.random().toString(36).substring(2, 7),
                            name: item.name || 'Experiencia SMA',
                            type: {
                                es: item.type || 'Aventura',
                                en: item.type_en || item.type || 'Adventure'
                            },
                            specialties: {
                                es: specsEs,
                                en: specsEn
                            },
                            desc: {
                                es: item.desc || '',
                                en: item.desc_en || item.desc || ''
                            },
                            phone: item.phone || '',
                            address: item.address || '',
                            maps: item.maps || '#',
                            web: item.web || '#',
                            facebook: item.facebook || '#',
                            instagram: item.instagram || '#',
                            whatsapp: item.whatsapp || '',
                            images: imgs
                        };
                    });

                    const formattedData = { adventures: normalizedAdventures };
                    localStorage.setItem('sma_adventures_data_v12', JSON.stringify(formattedData));
                    renderAdventures(document.getElementById('searchInput').value);
                    if (statusEl) statusEl.innerHTML = `<i class="fas fa-check-circle"></i> Sincronizado`;
                }
            } catch (error) {
                console.warn("Usando caché local:", error);
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#e67e22;"></i> Offline`;
            }
        }

        async function syncWithGoogleDrive() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sincronizando...`;
            try {
                const data = getStoredAdventures();
                await pushDataToGoogleSheets(data);
                setTimeout(() => {
                    statusEl.innerHTML = `<i class="fas fa-check-circle"></i> Sincronizado`;
                    alert(currentLang === 'es' ? '¡Sincronización con Google Drive y Sheets completada!' : 'Google Drive & Sheets sync completed!');

            } catch (error) {
                statusEl.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#c0392b;"></i> Error`;
                alert('No se pudo conectar con Google Apps Script.');
            }

                container.innerHTML += `
                    <div class="adventure-card" id="card-${a.key}">
                        <div class="carousel-container">
                            <span class="type-badge">${typeVal}</span>
                            <span class="specialties-badge">${primarySpec}</span>
                            <div class="carousel-slides" id="slides-${a.key}">
                                ${slidesHtml}
                            </div>
                            ${imgList.length > 1 ? `
                                <button class="carousel-btn prev" onclick="moveSlide('${a.key}', -1)"><i class="fas fa-chevron-left"></i></button>
                                <button class="carousel-btn next" onclick="moveSlide('${a.key}', 1)"><i class="fas fa-chevron-right"></i></button>
                            ` : ''}
                        </div>
                        <div class="adventure-body">
                            <div>
                                <h3 class="adventure-name">${a.name}</h3>
                                <p class="adventure-desc">${descVal}</p>
                                <div class="activities-list">
                                    ${specialtiesHtml}
                                </div>
                                <div class="adventure-meta">
                                    <div class="meta-item">
                                        <i class="fas fa-phone-alt"></i> <span>${a.phone}</span>
                                    </div>
                                    <a href="${a.maps}" target="_blank" rel="noopener noreferrer" class="meta-item">
                                        <i class="fas fa-map-marker-alt"></i> <span>${a.address}</span>
                                    </a>
                                </div>
                            </div>
                            <div>
                                <div class="adventure-actions">
                                    <div class="action-row">
                                        <a href="${a.maps}" target="_blank" rel="noopener noreferrer" class="btn-action map">
                                            <i class="fas fa-directions"></i> ${t.mapBtn}
                                        </a>
                                        ${webButtonHtml}
                                    </div>
                                    ${(fbButtonHtml || igButtonHtml) ? `
                                        <div class="social-row">
                                            ${fbButtonHtml}${igButtonHtml}
                                        </div>
                                    ` : ''}
                                    <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="btn-action whatsapp" style="margin-top: 4px;">
                                        <i class="fab fa-whatsapp"></i> ${t.waBtn}
                                    </a>
                                </div>
                                ${isLogged ? `<button class="btn-admin" style="width:100%; margin-top:10px;" onclick="openEditAdventureModal('${a.key}')">✏️ ${currentLang === 'es' ? 'Editar Actividad' : 'Edit Activity'}</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        const slideIndices = {};
        function moveSlide(key, direction) {
            if (!slideIndices[key]) slideIndices[key] = 0;
            const data = getStoredAdventures();
            const a = data.adventures.find(el => el.key === key);
            if (!a || !a.images) return;
            let imgList = a.images;
            if (typeof imgList === 'string') {
                try { imgList = JSON.parse(imgList); } catch(e) { imgList = imgList.split(',').map(s => s.trim()); }
            }

            slideIndices[key] += direction;
            if (slideIndices[key] >= imgList.length) slideIndices[key] = 0;
            if (slideIndices[key] < 0) slideIndices[key] = imgList.length - 1;

            const slider = document.getElementById(`slides-${key}`);
            if (slider) {
                slider.style.transform = `translateX(-${slideIndices[key] * 100}%)`;
            }
        }

        function convertImageFile(event, targetInputId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                document.getElementById(targetInputId).value = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openLoginModal() {
            if (localStorage.getItem('sma_admin_logged') === 'true') {
                if (confirm(currentLang === 'es' ? '¿Desea cerrar la sesión de administración?' : 'Do you want to log out?')) {
                    logoutAdmin();
                }
                return;
            }
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('usernameInput').value === AUTH_USER && document.getElementById('passwordInput').value === AUTH_PASS) {
                localStorage.setItem('sma_admin_logged', 'true');
                closeLoginModal();
                checkSession();
                renderAdventures(document.getElementById('searchInput').value);
                alert(currentLang === 'es' ? '¡Sesión iniciada con éxito!' : 'Successfully logged in!');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('sma_admin_logged');
            checkSession();
            renderAdventures(document.getElementById('searchInput').value);
            alert(currentLang === 'es' ? 'Sesión cerrada.' : 'Logged out.');
        }

        let currentEditingKey = null;
        function openEditAdventureModal(key) {
            const data = getStoredAdventures();
            const a = data.adventures.find(el => el.key === key);
            if (!a) return;
            currentEditingKey = key;
            document.getElementById('editAdvKey').value = key;
            document.getElementById('editName').value = a.name;
            
            document.getElementById('editType').value = typeof a.type === 'object' ? a.type.es : a.type;
            document.getElementById('editTypeEn').value = typeof a.type === 'object' ? a.type.en : '';

            let specsEs = typeof a.specialties === 'object' ? a.specialties.es : a.specialties;
            if (Array.isArray(specsEs)) specsEs = specsEs.join(', ');
            document.getElementById('editSpecialties').value = specsEs || '';

            let specsEn = typeof a.specialties === 'object' ? a.specialties.en : '';
            if (Array.isArray(specsEn)) specsEn = specsEn.join(', ');
            document.getElementById('editSpecialtiesEn').value = specsEn || '';

            document.getElementById('editDesc').value = typeof a.desc === 'object' ? a.desc.es : a.desc;
            document.getElementById('editDescEn').value = typeof a.desc === 'object' ? a.desc.en : '';

            document.getElementById('editPhone').value = a.phone;
            document.getElementById('editAddress').value = a.address;
            document.getElementById('editMaps').value = a.maps;
            document.getElementById('editWeb').value = a.web || '';
            document.getElementById('editFacebook').value = a.facebook || '';
            document.getElementById('editInstagram').value = a.instagram || '';
            
            let imgList = a.images;
            if (typeof imgList === 'string') {
                try { imgList = JSON.parse(imgList); } catch(e) { imgList = imgList.split(',').map(s => s.trim()); }
            }

            document.getElementById('editImg1').value = (imgList && imgList[0]) ? imgList[0] : '';
            document.getElementById('editImg2').value = (imgList && imgList[1]) ? imgList[1] : '';
            document.getElementById('editImg3').value = (imgList && imgList[2]) ? imgList[2] : '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEditedAdventure(e) {
            e.preventDefault();
            const data = getStoredAdventures();
            const index = data.adventures.findIndex(el => el.key === currentEditingKey);
            if (index !== -1) {
                data.adventures[index].name = document.getElementById('editName').value;
                data.adventures[index].type = {
                    es: document.getElementById('editType').value,
                    en: document.getElementById('editTypeEn').value || document.getElementById('editType').value
                };
                data.adventures[index].specialties = {
                    es: document.getElementById('editSpecialties').value.split(',').map(s => s.trim()).filter(s => s),
                    en: document.getElementById('editSpecialtiesEn').value.split(',').map(s => s.trim()).filter(s => s)
                };
                data.adventures[index].desc = {
                    es: document.getElementById('editDesc').value,
                    en: document.getElementById('editDescEn').value || document.getElementById('editDesc').value
                };
                data.adventures[index].phone = document.getElementById('editPhone').value;
                data.adventures[index].address = document.getElementById('editAddress').value;
                data.adventures[index].maps = document.getElementById('editMaps').value;
                data.adventures[index].web = document.getElementById('editWeb').value;
                data.adventures[index].facebook = document.getElementById('editFacebook').value;
                data.adventures[index].instagram = document.getElementById('editInstagram').value;
                data.adventures[index].images = [
                    document.getElementById('editImg1').value,
                    document.getElementById('editImg2').value,
                    document.getElementById('editImg3').value
                ].filter(img => img.trim() !== '');

                saveStoredAdventures(data, true);
                closeEditModal();
                alert(currentLang === 'es' ? '¡Actividad actualizada y sincronizada!' : 'Activity updated and synced!');
            }
        }

        function downloadAdventureTemplate() {
            const data = getStoredAdventures();
            const flatData = data.adventures.map(el => ({
                key: el.key,
                name: el.name,
                type: typeof el.type === 'object' ? el.type.es : el.type,
                type_en: typeof el.type === 'object' ? el.type.en : '',
                specialties: typeof el.specialties === 'object' && el.specialties.es ? el.specialties.es.join(', ') : el.specialties,
                specialties_en: typeof el.specialties === 'object' && el.specialties.en ? el.specialties.en.join(', ') : '',
                desc: typeof el.desc === 'object' ? el.desc.es : el.desc,
                desc_en: typeof el.desc === 'object' ? el.desc.en : '',
                phone: el.phone,
                address: el.address,
                maps: el.maps,
                web: el.web,
                facebook: el.facebook || '',
                instagram: el.instagram || '',
                whatsapp: el.whatsapp || '',
                images: Array.isArray(el.images) ? JSON.stringify(el.images) : el.images
            }));
            const worksheet = XLSX.utils.json_to_sheet(flatData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Aventura");
            XLSX.writeFile(workbook, "plantilla_aventura_bilingue_vivesanmiguel.xlsx");
        }

        function handleAdventureExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const dataArr = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(dataArr, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    if (json.length > 0) {
                        const data = getStoredAdventures();
                        json.forEach((row, idx) => {
                            if (idx < data.adventures.length) {
                                if (row.name) data.adventures[idx].name = row.name;
                                data.adventures[idx].type = {
                                    es: row.type || (typeof data.adventures[idx].type === 'object' ? data.adventures[idx].type.es : data.adventures[idx].type),
                                    en: row.type_en || row.type || (typeof data.adventures[idx].type === 'object' ? data.adventures[idx].type.en : data.adventures[idx].type)
                                };
                                
                                let specsEs = row.specialties ? (typeof row.specialties === 'string' ? row.specialties.split(',').map(s => s.trim()).filter(s => s) : row.specialties) : (typeof data.adventures[idx].specialties === 'object' ? data.adventures[idx].specialties.es : []);
                                let specsEn = row.specialties_en ? (typeof row.specialties_en === 'string' ? row.specialties_en.split(',').map(s => s.trim()).filter(s => s) : row.specialties_en) : specsEs;

                                data.adventures[idx].specialties = { es: specsEs, en: specsEn };

                                data.adventures[idx].desc = {
                                    es: row.desc || (typeof data.adventures[idx].desc === 'object' ? data.adventures[idx].desc.es : data.adventures[idx].desc),
                                    en: row.desc_en || row.desc || (typeof data.adventures[idx].desc === 'object' ? data.adventures[idx].desc.en : data.adventures[idx].desc)
                                };

                                if (row.phone) data.adventures[idx].phone = row.phone;
                                if (row.address) data.adventures[idx].address = row.address;
                                if (row.maps) data.adventures[idx].maps = row.maps;
                                if (row.web) data.adventures[idx].web = row.web;
                                if (row.facebook) data.adventures[idx].facebook = row.facebook;
                                if (row.instagram) data.adventures[idx].instagram = row.instagram;
                                if (row.whatsapp) data.adventures[idx].whatsapp = row.whatsapp;
                                if (row.images) {
                                    try {
                                        data.adventures[idx].images = typeof row.images === 'string' ? JSON.parse(row.images) : row.images;
                                    } catch(e) {
                                        data.adventures[idx].images = [row.images];
                                    }
                                }
                            }
                        });
                        saveStoredAdventures(data, true);
                        alert(currentLang === 'es' ? '¡Importación masiva y sincronización completada!' : 'Bulk import and sync completed!');
                    }
                } catch (err) {
                    alert(currentLang === 'es' ? 'Error al procesar el archivo Excel.' : 'Error processing Excel file.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        let currentLang = 'es';
        const translations = {
            es: {
                navHome: 'Inicio',
                mainTitle: 'Aventura y Experiencias al Aire Libre',
                mainSubtitle: 'Descubre cabalgatas, cañadas, cuatrimotos y expediciones inolvidables en San Miguel de Allende.',
                searchPlaceholder: 'Busca por nombre, actividad o categoría...',
                mapBtn: 'Mapa',
                waBtn: 'Reservar por WhatsApp',
                footerText: 'Vive San Miguel — Tu Guía de Confianza',
                toggleBtn: 'EN'
            },
            en: {
                navHome: 'Home',
                mainTitle: 'Adventure & Outdoor Experiences',
                mainSubtitle: 'Discover horseback riding, canyons, ATVs, and unforgettable expeditions in San Miguel de Allende.',
                searchPlaceholder: 'Search by name, activity, or category...',
                mapBtn: 'Map',
                waBtn: 'Book via WhatsApp',
                footerText: 'Vive San Miguel — Your Trusted Guide',
                toggleBtn: 'ES'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            const t = translations[currentLang];

            document.getElementById('langToggleBtn').textContent = t.toggleBtn;
            document.getElementById('navHomeText').textContent = t.navHome;
            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('mainSubtitle').textContent = t.mainSubtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('footerText1').textContent = t.footerText;

            renderAdventures(document.getElementById('searchInput').value);
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
            renderAdventures(); 
            fetchAdventuresFromCloud();
        });

        const cursorGlow = document.getElementById('cursor-glow');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.1;
            glowY += (mouseY - glowY) * 0.1;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        const canvas = document.getElementById('immersive-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 5;
                this.vx = Math.random() * 0.4 - 0.2;
                this.vy = Math.random() * 0.4 - 0.2;
                this.color = 'rgba(166, 75, 42, 0.18)';
            }
            update() {
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let maxDistance = 150;
                if (distance < maxDistance) {
                    let force = (maxDistance - distance) / maxDistance;
                    this.x -= (dx / distance) * force * this.density * 0.4;
                    this.y -= (dy / distance) * force * this.density * 0.4;
                } else {
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 25;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 25;
                }
                this.baseX += this.vx;
                this.baseY += this.vy;
                if (this.baseX < 0 || this.baseX > width) this.baseX = Math.random() * width;
                if (this.baseY < 0 || this.baseY > height) this.baseY = Math.random() * height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticlesSafe() {
            particles = [];
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }
        initParticlesSafe();

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>
