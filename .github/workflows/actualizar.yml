name: Actualizar Eventos Discover SMA

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install requests beautifulsoup4

      - name: Correr Script de Extracción
        run: python scraper.py

      - name: Guardar y Publicar Cambios en GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add eventos_sma.json
          git commit -m "Actualización automática de eventos [skip ci]" || echo "No hay cambios nuevos"
          git push
