<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Día de Muertos · San Miguel de Allende</title>

<!-- PWA Manifest & Theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b27a32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --void: #f5f0eb;
  --ink: #2b221e;
  --panel: #ffffff;
  --panel-2: #faf6f0;
  --gold: #b27a32;
  --gold-soft: #c48e42;
  --marigold: #d96b27;
  --text: #2b221e;
  --text-dim: #6c5c53;
  --line: rgba(178, 122, 50, 0.22);
  --line-soft: rgba(43, 34, 30, 0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--void);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217,107,39,0.08), transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 50%, rgba(178,122,50,0.07), transparent 45%),
    radial-gradient(ellipse 50% 30% at 0% 80%, rgba(140,53,38,0.06), transparent 40%);
}

.site {
  position: relative; z-index: 1;
  max-width: 1080px; margin: 0 auto; padding: 0 20px 100px;
}
@media (min-width: 720px) {
  .site { padding: 0 28px 100px; }
}

/* Top bar */
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 28px 0 40px; gap: 16px; flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text);
}
.logo img { height: 32px; width: auto; filter: contrast(1.1); }
.logo span { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; }
.back {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-dim); text-decoration: none; border: 1px solid var(--line);
  padding: 10px 18px; border-radius: 2px; transition: all 0.25s ease;
  background: rgba(255, 255, 255, 0.5);
}
.back:hover { color: var(--marigold); border-color: var(--marigold); background: #fff; }

/* Hero editorial */
.hero {
  padding: 20px 0 56px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 48px;
}
.hero-kicker {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--marigold); margin-bottom: 20px;
}
.hero h1 {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: clamp(3.2rem, 9vw, 6.5rem);
  font-weight: 400; line-height: 0.92; letter-spacing: -0.02em;
  color: var(--ink); margin-bottom: 24px;
}
.hero h1 em {
  font-style: italic; color: var(--marigold);
}
.hero-lead {
  max-width: 540px;
  font-size: 1.05rem; color: var(--text-dim); font-weight: 300; line-height: 1.7;
  margin-bottom: 28px;
}
.hero-stats {
  display: flex; flex-wrap: wrap; gap: 28px;
}
.stat {
  display: flex; flex-direction: column; gap: 4px;
}
.stat b {
  font-family: 'Instrument Serif', serif;
  font-size: 1.6rem; font-weight: 400; color: var(--gold);
}
.stat span { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }

/* Intro strip */
.intro {
  display: grid; grid-template-columns: 140px 1fr; gap: 32px;
  padding: 0 0 56px; margin-bottom: 20px;
  border-bottom: 1px solid var(--line-soft);
}
@media (max-width: 640px) {
  .intro { grid-template-columns: 1fr; gap: 12px; }
}
.intro-label {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--marigold); padding-top: 4px;
}
.intro p {
  font-size: 1.02rem; color: var(--text-dim); line-height: 1.8; font-weight: 300;
}
.intro p + p { margin-top: 12px; }
.intro strong { color: var(--ink); font-weight: 500; }

/* Month switcher */
.months {
  display: flex; gap: 32px; margin: 40px 0 48px; padding-bottom: 4px;
  border-bottom: 1px solid var(--line-soft);
}
.month-tab {
  background: none; border: none; cursor: pointer;
  font-family: 'Instrument Serif', serif;
  font-size: 1.6rem; color: var(--text-dim);
  padding: 0 0 12px; position: relative; transition: color 0.3s ease;
}
.month-tab::after {
  content: ''; position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
  background: var(--marigold); transition: width 0.3s ease;
}
.month-tab:hover { color: var(--marigold); }

@keyframes softCandleGlow {
  0%, 100% {
    color: var(--marigold);
    text-shadow: 0 0 8px rgba(217, 107, 39, 0.18);
  }
  50% {
    color: #b54911;
    text-shadow: 0 0 14px rgba(217, 107, 39, 0.35);
  }
}

.month-tab.active { 
  color: var(--marigold);
  animation: softCandleGlow 3.5s infinite ease-in-out;
}
.month-tab.active::after { width: 100%; }

.panel { display: none; }
.panel.active { display: block; animation: rise 0.45s ease; }
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

.section-title {
  font-family: 'Instrument Serif', serif;
  font-size: 0.95rem; font-weight: 400; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 28px;
}

/* Event — horizontal cinematic cards */
.event {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  box-shadow: 0 10px 30px -10px rgba(43, 34, 30, 0.06);
  margin-bottom: 20px;
  overflow: hidden;
  transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}
.event:hover {
  border-color: var(--line);
  transform: translateY(-2px);
  box-shadow: 0 16px 36px -10px rgba(43, 34, 30, 0.1);
}

@media (max-width: 768px) {
  .event { 
    grid-template-columns: 1fr; 
  }
}

.event-media {
  position: relative; 
  background: #e8e1da;
  width: 100%;
  height: 240px;
}
@media (min-width: 769px) {
  .event-media {
    height: auto;
    min-height: 100%;
    aspect-ratio: 3/4;
  }
}

.event-media img,
.event-media iframe {
  width: 100%; height: 100%; object-fit: cover; border: 0; display: block;
  position: absolute; inset: 0;
}

.event-content {
  padding: 24px 20px;
  display: flex; flex-direction: column; justify-content: center;
}
@media (min-width: 769px) {
  .event-content {
    padding: 32px 36px 32px 28px;
  }
}

.event-date {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--marigold); margin-bottom: 10px;
}
.event-title {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(1.55rem, 3vw, 2.1rem); font-weight: 400; line-height: 1.15;
  color: var(--ink); margin-bottom: 8px;
}
.event-place {
  font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px;
}
