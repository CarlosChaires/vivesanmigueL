<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel - Guía Turística de San Miguel de Allende</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.96);
            --cantera-terracotta: #b86b43;
            --cantera-rose: #d48384;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-glass: rgba(184, 107, 67, 0.18);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* --- Lienzo de Partículas Discretas e Inmersivas --- */
        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Aura Suave que Sigue el Puntero del Cursor --- */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(212, 131, 132, 0.2) 0%, rgba(184, 107, 67, 0.1) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .sma-main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* --- Cabecera con Logotipo Oficial e Identidad --- */
        .site-header-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            text-align: center;
        }

        .site-logo-container {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(184, 107, 67, 0.15);
            animation: float-logo 5s ease-in-out infinite;
            padding: 10px;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .site-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .interactive-brand-title {
            font-family: 'Playfair Display', serif, sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--primary-navy);
            text-decoration: none;
            display: block;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .brand-subtitle-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--cantera-terracotta);
            margin-top: 6px;
            font-weight: 700;
            display: block;
        }

        /* --- Botón Superior Único (Prepara tu Viaje) --- */
        .sma-buttons-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .sma-pastel-btn .wp-block-button__link {
            background: #ffffff !important;
            color: var(--primary-navy) !important;
            border: 1px solid var(--border-glass) !important;
            padding: 14px 36px !important;
            border-radius: 30px !important;
            font-weight: 700 !important;
            font-size: 14.5px !important;
            text-decoration: none !important;
            box-shadow: 0 6px 20px rgba(27, 42, 74, 0.06);
            transition: all 0.3s ease !important;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .sma-pastel-btn .wp-block-button__link:hover {
            background: var(--cantera-terracotta) !important;
            color: #ffffff !important;
            border-color: var(--cantera-terracotta) !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 107, 67, 0.3);
        }

        .wp-block-separator {
            border: none;
            height: 1px;
            background: rgba(184, 107, 67, 0.15);
            margin: 30px 0;
        }

        /* --- Tarjetas 3D Cristalinas Ultra Nítidas sobre Fondo Claro --- */
        .wp-block-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            margin-bottom: 3rem;
            align-items: stretch;
        }

        .wp-block-column {
            flex: 1;
            min-width: 320px;
            background: var(--surface-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 34px 30px;
            box-shadow: 0 20px 45px rgba(27, 42, 74, 0.08);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        .wp-block-column:hover {
            transform: translateY(-12px) rotateX(4deg) rotateY(-4deg) scale(1.03);
            box-shadow: 0 35px 70px rgba(184, 107, 67, 0.2), 0 0 30px rgba(212, 131, 132, 0.2);
            border-color: var(--cantera-terracotta);
            background: rgba(255, 255, 255, 0.99);
        }

        .wp-block-image {
            margin: 0 0 24px 0;
            overflow: hidden;
            border-radius: 20px;
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4ede4;
            position: relative;
        }

        .wp-block-image img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s ease;
            filter: contrast(1.05) saturate(1.1);
        }

        .wp-block-column:hover .wp-block-image img {
            transform: scale(1.1);
            filter: contrast(1.15) saturate(1.2);
        }

        .card-content-area {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .wp-block-buttons {
            display: flex;
            justify-content: center;
            margin: 18px 0;
            flex-shrink: 0;
        }

        p.is-service-description, p {
            color: var(--text-muted) !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            line-height: 1.75 !important;
            margin: 10px 0 0 0;
            text-align: center;
        }

        strong {
            color: var(--primary-navy) !important
