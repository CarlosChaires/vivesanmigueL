<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel - Guía Turística de San Miguel de Allende</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.95);
            --cantera-terracotta: #b86b43;
            --cantera-rose: #d48384;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-glass: rgba(184, 107, 67, 0.15);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* --- Lienzo de Partículas Sutiles y Elegantes --- */
        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Aura Suave del Puntero (Inmersión Reducida y Balanceada) --- */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(184, 107, 67, 0.12) 0%, rgba(212, 131, 132, 0.06) 50%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(40px);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .sma-main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1050px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* --- Cabecera Oficial Limpia con tu Logotipo --- */
        .site-header-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            text-align: center;
        }

        .site-logo-container {
            width: 85px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 25px rgba(184, 107, 67, 0.12);
            padding: 10px;
        }

        .site-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .interactive-brand-title {
            font-family: 'Playfair Display', serif, sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary-navy);
            text-decoration: none;
            display: block;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .brand-subtitle-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--cantera-terracotta);
            margin-top: 5px;
            font-weight: 700;
            display: block;
        }

        /* --- Botón Único de Navegación: Prepara tu Viaje (Con tu link de menú) --- */
        .sma-buttons-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .sma-pastel-btn .wp-block-button__link {
            background: #ffffff !important;
            color: var(--primary-navy) !important;
            border: 1px solid var(--border-glass) !important;
            padding: 13px 32px !important;
            border-radius: 30px !important;
            font-weight: 700 !important;
            font-size: 14px !important;
            text-decoration: none !important;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.04);
            transition: all 0.3s ease !important;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .sma-pastel-btn .wp-block-button__link:hover {
            background: var(--cantera-terracotta) !important;
            color: #ffffff !important;
            border-color: var(--cantera-terracotta) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184, 107, 67, 0.25);
        }

        .wp-block-separator {
            border: none;
            height: 1px;
            background: rgba(184, 107, 67, 0.15);
            margin: 30px 0;
        }

        /* --- Collage Visual Organizado (4 Secciones Clave) --- */
        .sma-collage-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 250px 250px;
            gap: 16px;
            margin-bottom: 35px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(27, 42, 74, 0.08);
            border: 1px solid var(--border-glass);
            background: #fff;
        }

        .collage-item {
            position: relative;
            overflow: hidden;
            background: #f4eee9;
        }

        .collage-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .collage-item:hover img {
            transform: scale(1.05);
        }

        .collage-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(27,42,74,0.82) 0%, transparent 100%);
            color: #ffffff;
            padding: 20px 18px 12px 18px;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* --- Cita Turística --- */
        .wp-block-pullquote {
            text-align: center;
            margin: 35px 0 20px 0;
            border: none;
            padding: 0;
        }

        .wp-block-pullquote blockquote p {
            font-family: 'Playfair Display', serif;
            font-size: 2rem !important;
            font-weight: 700;
            color: var(--primary-navy);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .wp-block-pullquote cite {
            font-style: normal;
            font-size: 0.95rem;
            color: var(--cantera-terracotta);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- Sección de Redes Sociales Visibles y Atractivas --- */
        .social-showcase-section {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            margin: 35px 0;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.04);
        }

        .social-showcase-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary-navy);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .social-showcase-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .social-buttons-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .social-card-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13.5px;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .social-card-btn.instagram {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .social-card-btn.tiktok {
            background: #111111;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .social-card-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        /* --- Footer Institucional Elegante --- */
        .has-foreground-background-color {
            background: var(--primary-navy) !important;
            border-radius: 28px;
            padding: 45px 30px;
            margin-top: 35px;
            color: #ffffff !important;
            box-shadow: 0 20px 50px rgba(27, 42, 74, 0.12);
        }

        .has-foreground-background-color h4 {
            font-family: 'Playfair Display', serif;
            color: #f4d0a9 !important;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .has-foreground-background-color p, 
        .has-foreground-background-color li {
            color: #94a3b8 !important;
            font-size: 13.5px;
            line-height: 1.65;
        }

        .wp-block-list {
            padding-left: 0;
            list-style: none;
        }

        .wp-block-list li {
            margin-bottom: 5px;
        }

        .wp-block-columns {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .wp-block-column {
            flex: 1;
            min-width: 200px;
        }

        /* --- Buscador --- */
        .wp-block-search {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .wp-block-search__input {
            width: 100%;
            max-width: 420px;
            padding: 13px 20px;
            background: #ffffff;
            border: 1px solid var(--border-glass);
            border-radius: 25px;
            color: var(--primary-navy);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13.5px;
            outline: none;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.03);
            transition: border-color 0.3s ease;
        }

        .wp-block-search__input:focus {
            border-color: var(--cantera-terracotta);
        }

        .wp-block-search__button {
            background: var(--cantera-terracotta);
            color: #ffffff;
            border: none;
            padding: 0 22px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 8px;
            transition: background 0.3s ease;
        }

        .wp-block-search__button:hover {
            background:
