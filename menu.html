<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel - Guía Turística de San Miguel de Allende</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f6;
            --surface-glass: rgba(255, 255, 255, 0.96);
            --cantera-terracotta: #b86b43;
            --cantera-rose: #d48384;
            --primary-navy: #1b2a4a;
            --text-main: #232b38;
            --text-muted: #626d7a;
            --border-glass: rgba(184, 107, 67, 0.15);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-sanmiguel);
            color: var(--text-main);
            min-height: 100vh;
        }

        .sma-main-wrapper { max-width: 1100px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 2; }

        /* Cabecera Limpia */
        .site-header-custom { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .site-logo-container { width: 100px; height: auto; }
        .site-logo-container img { width: 100%; height: auto; display: block; }
        .interactive-brand-title { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; color: var(--primary-navy); text-decoration: none; }
        
        /* Botones */
        .sma-pastel-btn .wp-block-button__link {
            background: #ffffff !important; color: var(--primary-navy) !important;
            border: 1px solid var(--border-glass) !important;
            padding: 12px 30px !important; border-radius: 30px !important;
            font-weight: 600 !important; font-size: 14px !important;
            box-shadow: 0 4px 15px rgba(27, 42, 74, 0.04);
            transition: all 0.3s ease !important;
        }

        /* Collage */
        .sma-collage-container {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 40px 0;
        }
        .collage-item { position: relative; overflow: hidden; border-radius: 20px; height: 240px; }
        .collage-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .collage-item:hover img { transform: scale(1.05); }

        /* Footer */
        .has-foreground-background-color { background: var(--primary-navy) !important; border-radius: 24px; padding: 40px; color: #fff !important; }

        @media (max-width: 768px) { .sma-collage-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="sma-main-wrapper">
    <!-- Cabecera con Logo sin círculo -->
    <header class="site-header-custom">
        <div class="site-logo-container">
            <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel">
        </div>
        <a href="https://carloschaires.github.io/vivesanmigueL/" class="interactive-brand-title">VIVE SAN MIGUEL</a>
    </header>

    <div class="sma-buttons-container">
        <div class="wp-block-button sma-pastel-btn">
            <a class="wp-block-button__link" href="https://carloschaires.github.io/vivesanmigueL/menu">PREPARA TU VIAJE</a>
        </div>
    </div>

    <!-- Collage con nuevas imágenes -->
    <div class="sma-collage-container">
        <div class="collage-item">
            <img src="https://lh3.googleusercontent.com/d/17TZ0GQqNKqTB-KAtJOJuBj0-558SxiBS" alt="Mapa">
            <div class="collage-caption">Mapa Turístico</div>
        </div>
        <div class="collage-item">
            <img src="https://lh3.googleusercontent.com/d/1BODFYKZzDOMN7cwmIN_aqzED5tkqzfTn" alt="Viñedos">
            <div class="collage-caption">Viñedos</div>
        </div>
        <div class="collage-item">
            <img src="https://lh3.googleusercontent.com/d/1HfJgLNg4GlYA4V8fVKc7H_5MJjnWkV_r" alt="Historia">
            <div class="collage-caption">Historia</div>
        </div>
        <div class="collage-item">
            <img src="https://lh3.googleusercontent.com/d/1706INrsU23bLUIrP4JB273CUHyhJbMHX" alt="Tradiciones">
            <div class="collage-caption">Tradiciones</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="has-foreground-background-color">
        <h4>Ponte en contacto</h4>
        <p>vivesma@gmail.com | +52 415 177 36 98</p>
    </footer>
</div>
</body>
</html>
