<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel - Guía Turística de San Miguel de Allende</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sanmiguel: #fbf9f5;
            --surface-glass: rgba(255, 255, 255, 0.94);
            --surface-card: rgba(255, 255, 255, 0.98);
            --cantera-terracotta: #b86b43;
            --cantera-rose: #d48384;
            --cantera-gold: #df9e7d;
            --primary-navy: #1b2a4a;
            --text-main: #1f2733;
            --text-muted: #55606d;
            --border-glow: rgba(184, 107, 67, 0.25);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fcf9f5 0%, #f4ede4 50%, #f9f4ed 100%);
            color: var(--text-main);
            line-height: 1.7;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        /* --- Lienzo de Partículas Consteladas de Fondo --- */
        #immersive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* --- Orbe de Luz Orgánica Dinámica que Sigue el Cursor --- */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(212, 131, 132, 0.28) 0%, rgba(184, 107, 67, 0.18) 45%, rgba(223, 158, 125, 0.08) 75%, transparent 90%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(55px);
            mix-blend-mode: multiply;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .sma-main-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* --- Botón de Inicio --- */
        .sma-inicio-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .sma-inicio-btn {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--primary-navy) !important;
            border: 1px solid var(--border-glow) !important;
            padding: 12px 32px !important;
            border-radius: 40px !important;
            font-weight: 600 !important;
            font-size: 13.5px !important;
            text-decoration: none !important;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(184, 107, 67, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
            letter-spacing: 0.8px;
        }
