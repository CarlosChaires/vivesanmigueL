<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive San Miguel | Guía Turística</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1b2a4a;
            --terracotta: #b86b43;
            --bg: #fcf9f5;
        }
        body { margin: 0; background-color: var(--bg); font-family: 'Outfit', sans-serif; color: var(--navy); overflow-x: hidden; }
        #canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }
        .container { position: relative; z-index: 2; max-width: 1000px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        
        /* Logo */
        .logo { width: 140px; margin-bottom: 20px; transition: transform 0.3s; }
        .logo:hover { transform: scale(1.05); }

        /* Botón */
        .cta-btn { 
            display: inline-block; padding: 15px 40px; background: var(--terracotta); color: white; 
            border-radius: 50px; text-decoration: none; font-weight: 600; margin-bottom: 40px;
            transition: 0.3s;
        }
        .cta-btn:hover { background: var(--navy); transform: translateY(-3px); }

        /* Collage */
        .collage { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .item { height: 250px; border-radius: 20px; overflow: hidden; position: relative; }
        .item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .item:hover img { transform: scale(1.1); }
        .caption { position: absolute; bottom: 10px; left: 10px; color: white; font-weight: 600; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="container">
        <img src="https://lh3.googleusercontent.com/d/1xW3HCK3utNSpM81IAiX-i1UzezDr-cXz" alt="Logo Vive San Miguel" class="logo">
        <h1>VIVE SAN MIGUEL</h1>
        
        <a href="https://carloschaires.github.io/vivesanmigueL/menu" class="cta-btn">PREPARA TU VIAJE</a>

        <div class="collage">
            <div class="item"><img src="https://lh3.googleusercontent.com/d/17TZ0GQqNKqTB-KAtJOJuBj0-558SxiBS" alt="Mapa"><span class="caption">Mapa Turístico</span></div>
            <div class="item"><img src="https://lh3.googleusercontent.com/d/1BODFYKZzDOMN7cwmIN_aqzED5tkqzfTn" alt="Viñedos"><span class="caption">Viñedos</span></div>
            <div class="item"><img src="https://lh3.googleusercontent.com/d/1HfJgLNg4GlYA4V8fVKc7H_5MJjnWkV_r" alt="Historia"><span class="caption">Historia</span></div>
            <div class="item"><img src="https://lh3.googleusercontent.com/d/1706INrsU23bLUIrP4JB273CUHyhJbMHX" alt="Tradiciones"><span class="caption">Tradiciones</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        class Particle {
            constructor(x, y) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = x;
                this.targetY = y;
                this.size = 2;
            }
            draw() {
                ctx.fillStyle = '#b86b43';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
            update() {
                this.x += (this.targetX - this.x) * 0.05;
                this.y += (this.targetY - this.y) * 0.05;
                if(mouse.x) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    if(Math.sqrt(dx*dx + dy*dy) < 100) { this.x -= dx * 0.1; this.y -= dy * 0.1; }
                }
            }
        }

        function init() {
            for(let i=0; i<500; i++) particles.push(new Particle(Math.random()*canvas.width, Math.random()*canvas.height));
        }
        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        init(); animate();
    </script>
</body>
</html>
